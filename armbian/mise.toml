# Tools for armbian/ on the Mac. tpi flashes and powers the Turing Pi 2's nodes through the BMC;
# uv compiles userpatches/rknn-requirements.txt. tpi asks for the BMC login, or uses the token
# it cached from the last login; credentials never go in this file.
[tools]
"github:turing-machines/tpi" = '1.0.7'
uv = '0.12.21'

[env]
# The BMC by IP rather than DNS name: the name carries the internal domain.
TPI_HOSTNAME = '192.168.1.215'
