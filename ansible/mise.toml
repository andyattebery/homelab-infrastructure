[tools]
python = '3'

[env]
_.python.venv = { path = ".venv", create = true }

[settings.python]
uv_venv_auto = false

[tasks.bootstrap]
description = 'Bootstrap Ansible environment'
run = [
  '[ "$(uname)" = "Darwin" ] && { brew list gnu-tar &>/dev/null || brew install gnu-tar; }',
  'python -m ensurepip --upgrade',
  'python -m pip install -r requirements.txt',
  'ansible-galaxy install -r requirements.yaml'
]

# Collections in requirements.yaml are pinned to a major-version range, so `--upgrade`
# pulls the newest release *within* each major and stops at the ceiling. Crossing a major
# is a deliberate edit to requirements.yaml, not something this task can do. Roles carry
# no version (ansible-galaxy has no range support for them), so `--force` takes latest.
[tasks.upgrade]
description = 'Upgrade Ansible environment within pinned major versions'
run = [
  'pip3 install --upgrade pip',
  'python -m pip install -r requirements.txt',
  'ansible-galaxy collection install -r requirements.yaml --upgrade',
  'ansible-galaxy role install --role-file requirements.yaml --force'
]

[tasks.facts]
description = "Get facts for a host"
run = 'ansible --module-name ansible.builtin.setup {{arg(name="hostname")}}'
