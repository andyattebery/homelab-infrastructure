# Blackbox probes: DNS resolution for the AdGuard HA cluster (dns_probe_a), and the TLS certificate
# each BMC serves (tls_cert).
#
# dns_probe_a:
#
# This exists because nothing else could see the 2026-08-21 outage, when AdGuard on the
# VIP holder answered every query but resolved nothing for 36 minutes: the VIP had a master
# the whole time, so `keepalived-no-master` could not fire, and the adguard-exporter only
# publishes 24h rolling aggregates — over the 36-minute window
# adguard_avg_processing_time_seconds moved 0 -> 4ms and sum(adguard_top_upstreams) moved
# 75.4M -> 75.6M. The cause is written up at upstream_dns in nix/modules/network.nix.
#
# dns-probe.{{ domain_name }} is an A record in our own zone (127.0.0.1, TTL 60) that
# exists only for health probing, and is deliberately absent from
# network-inventory/network_hosts_inventory.yaml.tpl — a NIM rewrite would make AdGuard
# answer it locally and the probe would stop testing upstream resolution. The same name is
# used by the keepalived track script on each node.
modules:
  dns_probe_a:
    prober: dns
    # Module-level, not part of the dns block.
    timeout: 5s
    dns:
      query_name: dns-probe.{{ domain_name }}
      query_type: A
      transport_protocol: udp
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        # "fail unless at least one answer RR matches" — i.e. require an actual answer.
        # NOT fail_if_not_matches_regexp, which means "every RR must match" and would pass
        # on an empty answer section.
        fail_if_none_matches_regexp:
          - ".*"

  # What a BMC actually serves, for the bmc-cert job in prometheus.yml. It measures the outcome
  # rather than asking a certbot container whether it succeeded, so it stays honest when that
  # container is broken or gone.
  tls_cert:
    prober: tcp
    # The old ASRock collector's cap: a shorter one gave false failures on that slow BMC.
    timeout: 15s
    tcp:
      tls: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls_config:
        # Required: the Turing Pi's stock bmcd sends the leaf without its intermediate, so Go's
        # verification fails on a healthy BMC. The expiry metric reads the peer certificates and
        # does not need a verified chain. The cost is that a certificate for the wrong name looks
        # healthy, as it did with the collector.
        insecure_skip_verify: true
