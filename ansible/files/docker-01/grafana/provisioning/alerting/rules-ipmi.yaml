# IPMI hardware alerts for nas-host-01 via prometheus-community/ipmi_exporter.
#
# Metric grounding:
# - ipmi_fan_speed_state: 0=Normal, 1=Warning, 2=Critical.
# - ipmi_sensor_state{name=~"PSU.*"}: 0=Normal, 1=Warning, 2=Critical.
#   (ipmi_power_state does not exist; PSU health is in ipmi_sensor_state.)
apiVersion: 1
groups:
  - orgId: 1
    name: ipmi
    folder: Hardware
    interval: 1m
    rules:
      - uid: ipmi-fan-or-psu-critical
        title: IPMI fan or PSU critical
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: ipmi_fan_speed_state == 2 or ipmi_sensor_state{name=~"PSU.*"} == 2
              instant: true
              refId: A
        for: 0s
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          component: ipmi
        annotations:
          summary: 'IPMI critical sensor on {{ $labels.instance }}: {{ $labels.name }}'
          description: |
            A fan or PSU sensor on {{ $labels.instance }} has reached Critical state.
            Check the IPMI dashboard or run `ipmitool sensor` on the host for details.
            A failed fan risks thermal throttle; a failed PSU risks unclean shutdown.
      # Certificates of the BMCs, from the bmc-cert job in prometheus.yml: blackbox-exporter's TLS
      # probe of what each BMC actually serves, so this stays honest when the certbot container that
      # installs it is broken or gone. It replaced textfile_collector_asrock_ipmi_cert's alert, so
      # both BMCs are watched the same way.
      #
      # Each arm is a filtering comparison, so a healthy BMC returns NO samples, and noDataState must
      # be OK. A previous version set it to Alerting to catch a collector that had stopped reporting;
      # that made the healthy state look the same as the dead one, and the rule fired continuously.
      # Missing data is caught by real series instead:
      # - `up == 0`: one target's scrape failed, for instance a BMC slower than the 20s scrape
      #   timeout. That target's probe_success goes stale rather than 0, and absent() stays false
      #   while the other BMC reports.
      # - `absent(up{...})`: the job is gone from prometheus.yml.
      #
      # It checks expiry only, not that the BMC serves the right certificate. A valid self-signed one
      # looks healthy here; each certbot container's serial comparison is what catches that.
      - uid: bmc-cert-expiring
        title: BMC certificate expiring or unreachable
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: probe_success{job="bmc-cert"} == 0 or up{job="bmc-cert"} == 0 or (probe_ssl_earliest_cert_expiry{job="bmc-cert"} - time()) < 14 * 86400 or absent(up{job="bmc-cert"})
              instant: true
              refId: A
        # Must exceed the job's 4m scrape interval, so one bad sample can never fire on its own.
        # Installing a certificate bounces the BMC's web service, so a probe that lands mid-rotation
        # fails legitimately; that was observed on the ASRock BMC's first deploy. Nothing is lost by
        # waiting: the expiry arm has 14 days of headroom, and certbot renews with 30 left.
        for: 2h
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          component: bmc
        annotations:
          summary: 'BMC certificate problem on {{ $labels.instance }}'
          description: |
            One of four things: the TLS probe of the BMC failed, Prometheus could not scrape the
            probe, the certificate the BMC serves expires within 14 days, or the bmc-cert job is gone
            from prometheus.yml. An empty instance above means the last.

            Otherwise the certbot container should reconcile this within 24 hours by itself. If it is
            still firing after that, the install is failing rather than the renewal. Check
            `docker logs {{ $labels.certbot_container }}` on docker-01, then compare what the BMC
            serves against the certificate on disk:
              openssl s_client -connect {{ $labels.instance }} </dev/null | openssl x509 -noout -dates -serial

      # Added 2026-09-09 after nas-host-01 powered itself off for the third time (06-29, 08-28,
      # 09-09) with a CPU_THERMTRIP asserted at 34 C and every voltage rail flat.
      #
      # Two rules because neither alone is reliable. The sensor rule catches the assertion only
      # if the BMC is still answering when it happens — on 09-09 the BMC went unreachable for the
      # whole hour the host was off, so it would have missed it. The power-state rule catches the
      # consequence instead, which is what actually persisted.
      - uid: ipmi-cpu-thermtrip
        title: CPU thermal trip asserted
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: ipmi_sensor_state{name=~"CPU_THERMTRIP|PROCHOT.*"} > 0
              instant: true
              refId: A
        for: 0s
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          component: ipmi
        annotations:
          summary: 'Thermal trip or throttle asserted on {{ $labels.instance }}: {{ $labels.name }}'
          description: |
            The CPU asserted THERMTRIP or PROCHOT. THERMTRIP cuts the power rails immediately: the
            host will be off, the front-panel power button will do nothing, and only an AC cycle
            recovers it.

            Do not assume heat. On nas-host-01 this has fired with the CPU at 34 C, the board at
            35 C and all fans steady, which points at the THERMTRIP signal path rather than
            temperature — socket contact, the VRM, or the BMC. Check `ipmitool sel elist` on the
            host for the assertion and what preceded it, and the Prometheus voltage series for a
            rail moving before the trip.
      - uid: ipmi-host-unexpectedly-powered-off
        title: Host unexpectedly powered off
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: ipmi_chassis_power_state == 0
              instant: true
              refId: A
        # 5m so an ordinary reboot does not page: a reboot brings the chassis back well inside
        # that, and a deliberate shutdown is rare and human-initiated.
        for: 5m
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          component: ipmi
        annotations:
          summary: 'Chassis power is off on {{ $labels.instance }}'
          description: |
            The BMC reports the chassis powered down and it has stayed down for five minutes. If
            nobody shut it down, this is the signature of a thermal trip or a power fault rather
            than an OS shutdown.

            First stop is `ipmitool sel elist` — the BMC event log is the only record that
            survives a power cut, and it holds about 3,600 entries. Save it before anything else
            if it is near full.

# The rule this file used to provision for the ASRock BMC alone, replaced by bmc-cert-expiring above.
# Leaving a rule out of a provisioning file does not delete it: Grafana's provisioner only acts on
# what the files list (pkg/services/provisioning/alerting/rules_provisioner.go, read at v13.0.2), so
# without this the old rule would stay, and its absent() arm would page once its collector was gone.
# Deleting a uid that is already gone is a no-op, so this stays.
deleteRules:
  - orgId: 1
    uid: asrock-ipmi-cert-expiring
