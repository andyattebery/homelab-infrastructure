# DNS HA alerts: keepalived VIP ownership, whether the VIP actually resolves, and
# AdGuard sync freshness.
#
# Ownership and resolution are separate questions and both need a rule. On 2026-08-21 the
# VIP had a master for the whole 36-minute outage while resolving nothing, so an
# ownership-only ruleset stayed silent throughout. See
# tasks/keepalived-vip-dns-outage-2026-08-21.md.
#
# Metric grounding:
# - keepalived_vrrp_state (mehdy/keepalived-exporter v1.7.1+):
#   0=Init, 1=Backup, 2=Master, 3=Fault. Labels: iname, intf, ip_address, vrid.
#   On pi-rack the exporter runs --ka.container.pid-path, signalling via docker exec
#   (not docker kill) to avoid s6-overlay signal conflicts; on network-01 and network-03,
#   which are NixOS, it runs --ka.pid-path against the host process.
# - probe_success{job="dns-probe"} (blackbox-exporter on docker-01, module dns_probe_a):
#   1 if that DNS server returned an A record for dns-probe.<domain_name>, else 0. The
#   `role` label is set in prometheus.yml -- "vip" for the VIP, "node" per peer -- because
#   this file is copied rather than templated and so cannot reference the VIP's address.
# - adguard_home_sync_sync_successful (built-in metrics on network-01:8080/metrics):
#   1 if last sync succeeded, 0 if it failed. Per-replica hostname label.
apiVersion: 1
groups:
  - orgId: 1
    name: dns-ha
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: keepalived-no-master
        title: Keepalived VIP has no master
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: sum(keepalived_vrrp_state == 2) == 0
              instant: true
              refId: A
        for: 1m
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          component: dns
        annotations:
          summary: 'No keepalived master for the DNS VIP'
          description: |
            No peer reports keepalived_vrrp_state == 2 (Master) for 1+ minute.
            Nothing owns 192.168.1.222, so DNS is down for every client. Check keepalived
            on all three peers: `journalctl -u keepalived` on network-01 and network-03
            (both NixOS), `docker logs keepalived` on pi-rack.

            Note this rule cannot catch the 2026-08-21 failure, where a master existed the
            whole time but could not resolve. That is `dns-vip-not-resolving` below.

      - uid: dns-vip-not-resolving
        title: DNS VIP is not resolving
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: probe_success{job="dns-probe", role="vip"} == 0
              instant: true
              refId: A
        for: 2m
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          component: dns
        annotations:
          summary: 'The DNS VIP is answering but cannot resolve'
          description: |
            blackbox could not get an A record for dns-probe.<domain_name> from the VIP for
            2+ minutes. Whoever holds the VIP is failing to resolve — the VIP itself may
            well be up, which is why keepalived-no-master stays silent.

            This is the 2026-08-21 failure mode: AdGuard alive and serving ~1000 queries/min
            with every upstream unreachable. Check `journalctl -u adguardhome` on the VIP
            holder for dnsproxy errors, then dns-node-not-resolving to see which peers are
            healthy.

      - uid: dns-node-not-resolving
        title: An AdGuard node is not resolving
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: probe_success{job="dns-probe", role="node"} == 0
              instant: true
              refId: A
        for: 5m
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          component: dns
        annotations:
          summary: 'AdGuard on {{ $labels.instance }} cannot resolve'
          description: |
            That node has failed to return an A record for dns-probe.<domain_name> for 5+
            minutes. Its keepalived track script runs the same query, so it should already
            have dropped 75 priority; confirm with keepalived_vrrp_state that the VIP has
            moved to a healthy peer.

            If every node is listed, this is an upstream or internet-wide failure rather
            than a node fault — all three lose the same 75, the priority order is preserved
            and the VIP deliberately stays put.

      - uid: adguardhome-sync-drift
        title: AdGuard sync failing
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: fe8ew4zkvbf28a
            model:
              datasource:
                type: prometheus
                uid: fe8ew4zkvbf28a
              expr: min(adguard_home_sync_sync_successful) == 0
              instant: true
              refId: A
        for: 10m
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          component: dns
        annotations:
          summary: 'AdGuard sync failing for at least one replica'
          description: |
            At least one replica's last sync has been failing for 10+ minutes.
            Check `journalctl -u adguardhome-sync` on network-01 for errors.
