---
services:
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.1-4.8.0-distroless
    container_name: dcgm-exporter
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "9400:9400"
  # No model backend is configured here. Model serving moved to llama-swap on htpc-01,
  # and open-webui takes its providers from its own settings rather than an env var.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - ${DOCKER_DATA_DIRECTORY}/open-webui:/app/backend/data
    networks:
      - traefik
      - openwebui
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    labels:
      - traefik.enable=true

networks:
  openwebui:
    name: openwebui
  traefik:
    name: traefik
    external: true
