# Throwaway containers for the vdesktop role tests. Created by setup.yml,
# destroyed by teardown.yml. Nothing here is a real host.
#
# `ansible_python_interpreter` is pinned because the base images have no python3
# until setup.yml installs it, and `auto_silent` (ansible.cfg) would otherwise
# probe and cache the wrong answer during the raw bootstrap.

[vdesktop_test]
# Native arm64 on an arm64 Mac: fast, and it is the leg that catches an
# Architectures: field hardcoded to amd64. Both vendor repos publish arm64
# (LizardByte: 4 sunshine entries; Mozilla: 4 firefox entries), so this leg can
# prove the repos end to end rather than only rendering a file.
vdesktop-test-trixie        vdesktop_test_image=debian:13        vdesktop_test_platform=linux/arm64

# Emulated, and therefore only justified by something the native leg cannot
# answer: intel-media-va-driver is published for amd64 ONLY -- trixie/arm64 has
# no such package -- and the real CT is amd64. This is also the leg whose
# architecture matches production.
vdesktop-test-trixie-amd64  vdesktop_test_image=amd64/debian:13  vdesktop_test_platform=linux/amd64

[vdesktop_test:vars]
ansible_connection=community.docker.docker
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
