# Throwaway containers for the apt-source role tests. Created by setup.yml,
# destroyed by teardown.yml. Nothing here is a real host.
#
# `ansible_python_interpreter` is pinned because the base images have no
# python3 until setup.yml installs it, and `auto_silent` (ansible.cfg) would
# otherwise probe and cache the wrong answer during the raw bootstrap.

[apt_test]
# Both Debian releases, deliberately. They fail DIFFERENTLY: bookworm signs its
# archive with debian-archive-keyring.gpg and produces the duplicate-target
# warnings reported from vm-host-01/02, while trixie signs with .pgp and turns
# the same bug into a hard "Conflicting values set for option Signed-By" error.
# Testing only trixie would miss the symptom actually reported in production.
apt-test-debian12      apt_test_image=debian:12    apt_test_family=Debian apt_test_platform=linux/arm64
apt-test-debian13      apt_test_image=debian:13    apt_test_family=Debian apt_test_platform=linux/arm64

# Proxmox VE 9 is Debian 13, but its installer writes debian.sources signing with
# debian-archive-keyring.GPG, where stock trixie uses .PGP. That one character is
# the difference between the duplicate-target warning reported from vm-host-01/02
# and a fatal "Conflicting values set for option Signed-By". The whole PVE fleet
# is on 9, so this shape — not stock trixie — is the production case.
# apt_test_force_signed_by rewrites the stock file to match.
apt-test-pve9          apt_test_image=debian:13    apt_test_family=Debian apt_test_platform=linux/arm64 apt_test_force_signed_by=/usr/share/keyrings/debian-archive-keyring.gpg
apt-test-ubuntu2404    apt_test_image=ubuntu:24.04 apt_test_family=Ubuntu apt_test_platform=linux/arm64
apt-test-ubuntu2604    apt_test_image=ubuntu:26.04 apt_test_family=Ubuntu apt_test_platform=linux/arm64

# mise only: upstream's ppa:jdxcode/mise publishes resolute/amd64 and NOTHING for
# arm64, so the PPA branch of the mise role can only be exercised on amd64.
# Emulated, like the snapper leg.
apt-test-ubuntu2604-amd64 apt_test_image=amd64/ubuntu:26.04 apt_test_family=Ubuntu apt_test_platform=linux/amd64

# snapper only. OBS publishes filesystems:/snapper/ for amd64 ONLY -- every
# distro directory (Debian_12, Debian_13, xUbuntu_24.04, xUbuntu_26.04) contains
# just amd64/. On an arm64 host the source is valid and `apt update` succeeds,
# but no snapper package is a candidate. Both legs are emulated for that reason.
# The Debian one is not redundant: the defect being fixed is that the Debian
# path installed `fish` instead of `snapper`, and only an install on Debian
# proves it gone.
apt-test-snapper-amd64 apt_test_image=amd64/ubuntu:24.04 apt_test_family=Ubuntu apt_test_platform=linux/amd64
apt-test-snapper-deb-amd64 apt_test_image=amd64/debian:13 apt_test_family=Debian apt_test_platform=linux/amd64

[apt_test:vars]
ansible_connection=community.docker.docker
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
