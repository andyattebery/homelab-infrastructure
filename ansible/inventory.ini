[local]
localhost ansible_host=localhost ansible_connection=local

# cloud
[cloud]
cloud-01

# homelab
[homelab]
backup-01
docker-01
jetson-01
media-01
nas-01
pi-camera
pi-rack
pi-turntable
pikvm
pikvm-hid
# Unprivileged LXC on vm-host-01, created by the first play of
# playbook-vdesktop-01.yaml via roles/pve_lxc -- the only container in this fleet.
# Matches the ssh_config `*-0*` rule, so it resolves to the same login user as
# every other homelab host.
vdesktop-01

# network-01 and network-03 are NixOS (nix/hosts/network-0{1,3}). network-02 is an
# inventory alias for the bare-metal pi-rack, the only Ansible-managed member left.
[network]
network-02

[prod_proxmox_cluster]
vm-host-01
vm-host-02
nas-host-01

# Secondary NUT clients of the pi-rack server. pi-rack itself is not a member — it
# monitors rack-ups@localhost as primary via nut_monitor_primary_password.
[pi_rack_nut_clients]
nas-host-01
vm-host-01
vm-host-02
backup-01

