    - role: samba
      vars:
        samba_users:
          - username: "{{ smb_nas_01_username }}"
            password: "{{ smb_nas_01_password }}"
        samba_homes_enabled: true
        # The five one-off shares. One share per media data disk is appended from
        # nas_01_media_disk_samba_shares in host_vars/nas-01/vars.yaml, which derives them
        # from storage_media_data_disks — the same list htpc-01 and media-01 mount. Order
        # matters only in that it is the order smb.conf comes out in.
        _nas_01_one_off_shares:
          - name: depot
            path: /mnt/depot
          - name: proxmox
            path: /mnt/tank/proxmox
          - name: sink
            path: /mnt/sink
          - name: storage
            path: /mnt/storage
          - name: tank
            path: /mnt/tank
        samba_shares: "{{ _nas_01_one_off_shares + nas_01_media_disk_samba_shares }}"
      tags: samba
    # - role: mise
    - role: docker_compose_traefik
      vars:
        docker_compose_traefik_enable_dashboard: true
        docker_compose_traefik_enable_tailscale: true
        docker_compose_traefik_log_level: ERROR
        # This host serves the gpu-encoder-sweep hub, whose exchange is a single streamed PUT per file:
        # a reference cut or a large encode runs for minutes. Traefik v3 defaults readTimeout to 60s
        # covering the entire request body, so without this every such upload dies at one minute --
        # and it dies as a transport error, not as a refusal that says what to do.
        #
        # Only nas-01 sets it. The other five hosts running this role keep the 60s default.
        docker_compose_traefik_websecure_read_timeout: "0"
      tags: traefik
