    - name: Configure syncoid to backup-01
      ansible.builtin.include_role:
        name: syncoid_source
      vars:
        syncoid_source_username: "{{ ansible_user }}"
        syncoid_source_ssh_private_key: "{{ nas_01_syncoid_ssh_private_key }}"
        syncoid_source_ssh_key_path: "/home/{{ ansible_user }}/.ssh/id_ed25519_syncoid"
        syncoid_destination_username: "syncoid"
        syncoid_destination_host: "backup-01.{{ domain_name }}"
        syncoid_timer_on_calendar: "*-*-* 02:00:00"
        syncoid_datasets:
          - syncoid_source_dataset: tank
            syncoid_destination_dataset: backups/tank
            syncoid_destination_dataset_mountpoint: /mnt/backups/tank
            syncoid_healthchecks_uuid: 8493a848-6cfd-4ab9-9931-c94a6b053b21
          - syncoid_source_dataset: sink
            syncoid_destination_dataset: backups/sink
            syncoid_destination_dataset_mountpoint: /mnt/backups/sink
            syncoid_healthchecks_uuid: b5eaeb0d-e04c-49da-bf13-020e82560a2a
    - name: Configure remote_power_control client
      ansible.builtin.include_role:
        name: remote_power_control
      vars:
        remote_power_control_client: true
        remote_power_control_extra_profiles:
          offsite: "{{ remote_power_control_profile_offsite }}"
    - name: Configure offsite-nas as a syncoid destination
      vars:
        syncoid_destination_host: "offsite-nas.{{ tailscale_tailnet }}"
        syncoid_destination_username: "{{ offsite_nas_syncoid_username }}"
        syncoid_source_ssh_key_path: "/home/{{ ansible_user }}/.ssh/id_ed25519_syncoid"
        shutdown_tracker_complete_caller_script_path: "/usr/local/bin/shutdown_tracker_complete_call_{{ syncoid_destination_host | replace('.', '_') }}"
      block:
        - name: Configure shutdown_tracker source for offsite-nas
          ansible.builtin.include_role:
            name: shutdown_tracker
          vars:
            shutdown_tracker_source: true
            shutdown_tracker_source_ssh_key_path: "{{ syncoid_source_ssh_key_path }}"
            shutdown_tracker_destination_host: "{{ syncoid_destination_host }}"
            shutdown_tracker_destination_username: "{{ syncoid_destination_username }}"
        - name: Configure syncoid to offsite-nas
          ansible.builtin.include_role:
            name: syncoid_source
          vars:
            syncoid_source_username: "{{ ansible_user }}"
            syncoid_source_ssh_private_key: "{{ nas_01_syncoid_ssh_private_key }}"
            syncoid_pre_sync_commands:
              - "/usr/local/bin/remote_power_control --profile offsite offsite-nas.{{ tailscale_tailnet }} pikvm on"
            syncoid_post_sync_commands:
              - "{{ shutdown_tracker_complete_caller_script_path }} nas-01"
            syncoid_timer_on_calendar: "*-*-* 03:00:00"
            syncoid_datasets:
              - syncoid_source_dataset: tank
                syncoid_destination_dataset: backups/tank
                syncoid_destination_dataset_mountpoint: /mnt/backups/tank
                syncoid_healthchecks_uuid: bc333132-22d4-49de-a975-15ff8683b037
              - syncoid_source_dataset: sink
                syncoid_destination_dataset: backups/sink
                syncoid_destination_dataset_mountpoint: /mnt/backups/sink
                syncoid_healthchecks_uuid: e79fc71c-6322-484a-93ef-74f63c6e6ef9
    # The hub's exchange directory. Created here rather than by the role because it is a host path,
    # and BEFORE the role because Docker creates a missing bind source itself, as root.
    #
    # Owned by the DEPLOYING user, not the SMB identity it used to carry. No node mounts this
    # directory any more — the exchange moved onto the hub's HTTPS API, so the hub is its only
    # writer and nothing reaches it over SMB. Matching the uid the hub container runs as is what
    # lets an operator remove a file by hand, which is what the hub's refusal text tells them to do
    # when a republish differs.
    - name: Create the gpu-encoder-sweep exchange directory
      tags: gpu_encoder_sweep
      ansible.builtin.file:
        path: /mnt/storage/temp/gpu-encoder-sweep
        state: directory
        owner: "{{ ansible_non_become_user_id }}"
        group: "{{ ansible_non_become_user_gid }}"
        mode: "0775"

    # In tasks: rather than roles: so it runs after the directory above — every role in roles: runs
    # first. The traefik network it joins is created by docker_compose_traefik in that list.
    #
    # `apply` is required: tags on an include_role task gate the include itself, they do not
    # propagate to the tasks inside the role.
    #
    # The tag is pinned for the M2 smoke. The hub hands a run only to an agent whose reported
    # artifact matches the one the run was planned for, so a floating tag changes the artifact under
    # already-planned runs and every claim then answers 409 until they are re-planned.
    #
    # The operator token and the agent tokens come from group_vars/all/vars.yaml.
    - name: Deploy the gpu-encoder-sweep hub
      tags: gpu_encoder_sweep
      ansible.builtin.include_role:
        name: docker_compose_gpu_encoder_sweep_hub
        apply:
          tags: gpu_encoder_sweep
      vars:
        docker_compose_gpu_encoder_sweep_hub_image_tag: sha-9e238d5
        # This host's own row in the catalogue, and the bearer its agent presents. The hub runs an
        # agent beside itself because `sweep inventory` executes on the hub's runtime and nowhere
        # else — this is the host with the library mounted.
        docker_compose_gpu_encoder_sweep_hub_host: nas-01
        docker_compose_gpu_encoder_sweep_hub_agent_token: "{{ gpu_encoder_sweep_agent_tokens['nas-01'] }}"
        # The whole media pool, read-only. ⚠ The CONTAINER path is recorded in every title row
        # permanently, so /library is chosen once and does not move.
        docker_compose_gpu_encoder_sweep_hub_library_path: /mnt/storage

