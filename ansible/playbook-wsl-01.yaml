---
- name: Configure wsl-01
  hosts: wsl-01
  become: true

  vars:
    docker_compose_dst_data_directory_path: "/opt/docker-compose"
    # Consumed by geerlingguy.security, which configure_server pulls in. Socket activation makes
    # the `Port` line it writes into sshd_config dead text (see the drop-in task below), but
    # leaving it at the role default of 22 makes that file lie about which port the host answers
    # on, which is worse than a line nothing reads.
    security_ssh_port: "{{ sshd_port }}"

  handlers:
    - name: Restart ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: restarted
        daemon_reload: true

  tasks:
    # WSL runs mirrored networking (files/wsl-01/bootstrap-wsl.ps1), so this host shares eta's IP
    # with the Windows OpenSSH server. Windows holds 22 there and a Linux bind on a port Windows
    # already owns is refused, so wsl-01's sshd has to live somewhere else.
    #
    # It is ssh.socket that decides where. Ubuntu socket-activates sshd from 22.10 on, and under
    # socket activation `Port` and `ListenAddress` in sshd_config are ignored outright -- editing
    # sshd_config to move the port reports changed and does nothing.
    #
    # The bare `ListenStream=` is load-bearing: it clears the 22 inherited from the packaged unit.
    # Drop it and you get 22 *and* sshd_port, and the 22 collides with Windows again.
    #
    # IPv4 is spelled out rather than left to the packaged unit's bare `ListenStream=22`, which
    # binds [::] only and leans on net.ipv6.bindv6only=0 to catch IPv4 as well. That does not
    # happen on this host -- every other listener here is a separate 0.0.0.0/[::] pair -- so the
    # inherited form yields an IPv6-only sshd and connection-refused over IPv4. Upstream fixed
    # this the same way, by listing the families explicitly (LP#2080216). No [::] line: nothing
    # reaches wsl-01 over IPv6, and an unverified second bind is one more thing to fail the unit.
    - name: Create ssh.socket drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Set sshd listening port
      ansible.builtin.copy:
        dest: /etc/systemd/system/ssh.socket.d/port.conf
        content: |
          [Socket]
          ListenStream=
          ListenStream=0.0.0.0:{{ sshd_port }}
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh.socket

    - name: Configure server
      ansible.builtin.include_role:
        name: configure_server

    - name: Install Docker
      ansible.builtin.include_role:
        name: geerlingguy.docker

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.include_role:
        name: nvidia_container_toolkit

    - name: Install mise
      ansible.builtin.include_role:
        name: mise

    - name: Deploy Traefik
      ansible.builtin.include_role:
        name: docker_compose_traefik
        # `apply` is required: tags on an include_role task gate the include itself, they do not
        # propagate to the tasks inside the role. Without this, `--tags traefik` runs the include
        # and then silently skips every task in it.
        apply:
          tags: traefik
      vars:
        docker_compose_traefik_enable_dashboard: true
      tags: traefik

    - name: Deploy dashboard-services-manager provider
      ansible.builtin.include_role:
        name: docker_compose_dashboard_services_manager_provider

    - name: Create BtbN ffmpeg directory
      ansible.builtin.file:
        path: /opt/ffmpeg-btbn/bin
        state: directory
        mode: "0755"
        owner: root

    - name: Install BtbN FFmpeg (master build with av1_nvenc tune uhq support)
      ansible.builtin.include_role:
        name: github_release_install
      vars:
        github_release_install_repo: BtbN/FFmpeg-Builds
        github_release_install_asset_patterns:
          x86_64: "ffmpeg-master-latest-linux64-gpl.tar.xz"
        github_release_install_archive_type: tarball
        github_release_install_binary_in_archive: ffmpeg-master-latest-linux64-gpl/bin/ffmpeg
        github_release_install_binary_path: /opt/ffmpeg-btbn/bin/ffmpeg
        github_release_install_version_command: "echo latest"
        github_release_install_version_regex: "(.*)"

    - name: Deploy Tdarr node
      ansible.builtin.include_role:
        name: docker_compose_tdarr
      vars:
        docker_compose_tdarr_component: node
        docker_compose_tdarr_storage_host: nas-01
        docker_compose_tdarr_smb_username: "{{ smb_nas_01_username }}"
        docker_compose_tdarr_smb_password: "{{ smb_nas_01_password }}"
        docker_compose_tdarr_smb_uid: "{{ smb_nas_01_uid }}"
        docker_compose_tdarr_smb_gid: "{{ smb_nas_01_gid }}"
        docker_compose_tdarr_nvidia_gpu: true
        docker_compose_tdarr_nvidia_gpu_wsl: true
        docker_compose_tdarr_transcode_gpu_workers: 3
        docker_compose_tdarr_transcode_cpu_workers: 0
        docker_compose_tdarr_custom_ffmpeg_path: /opt/ffmpeg-btbn/bin
        docker_compose_tdarr_hardlink_disks:
          - data01
          - data02
          - data03
          - data08
          - data11
          - data12

    - name: Deploy TabbyAPI
      ansible.builtin.include_role:
        name: docker_compose
      vars:
        docker_compose_src_file_path: files/wsl-01/docker-compose-tabbyapi.yml
        docker_compose_src_config_files:
          - src_file_path: files/wsl-01/tabbyapi-config.yml
            dst_relative_file_path: tabbyapi/config.yml
            service_name_to_restart: tabbyapi
