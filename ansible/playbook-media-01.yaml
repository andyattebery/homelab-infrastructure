---
- name: Configure nas
  hosts: media-01
  become: true

  vars:
    docker_compose_dst_data_directory_path: /mnt/data

    # Custom ffmpeg for Tdarr, bind-mounted into the container at /ffmpeg. A dedicated
    # directory rather than /usr/local/bin because the whole directory is mounted and must
    # hold nothing else. Same path as htpc-01, deliberately — the two hosts run one build.
    media_ffmpeg_dir: /opt/jellyfin-ffmpeg/bin

  pre_tasks:
    - name: Install packages
      ansible.builtin.package:
        name:
          - linux-image-generic # Install linux-modules-extra for the CIFS module
          - zfsutils-linux
          - cifs-utils
          - nvtop

    # The ffmpeg Tdarr actually runs. Installed on the host and mounted read-only rather
    # than baked into the image, so the encoder and the container upgrade separately.
    # pre_tasks, because the mount source has to exist before docker_compose_tdarr brings
    # the container up down in `roles:`.
    #
    # root-owned, unlike htpc-01: there the directory is chowned to the Tdarr PUID because
    # podman_quadlet chowns every Volume= source. Docker bind-mounts do no such thing, and
    # this one is :ro.
    - name: Create jellyfin-ffmpeg directory
      tags: [tdarr, ffmpeg]
      ansible.builtin.file:
        path: "{{ media_ffmpeg_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # use_tag_stamp, not the `echo <tag>` idiom: this build reports 8.1.2-Jellyfin while the
    # release is tagged v8.1.2-2+nvenc-n13.0.19.1, so no regex over `ffmpeg -version` can
    # ever equal the tag. The stamp also carries the asset digest, which is what makes this
    # fork tractable at all — it republishes assets under an unchanged tag, and a tag-only
    # comparison would install once and then believe itself converged forever.
    - name: Install jellyfin-ffmpeg (fork build with av1_nvenc tune uhq and tonemap_cuda)
      tags: [tdarr, ffmpeg]
      ansible.builtin.include_role:
        name: github_release_install
        apply:
          tags: [tdarr, ffmpeg]
      vars:
        github_release_install_repo: andyattebery/jellyfin-ffmpeg
        github_release_install_asset_patterns:
          x86_64: 'linux64-gpl\.tar\.xz$'
        github_release_install_archive_type: tarball
        github_release_install_binary_in_archive: "{{ item }}"
        github_release_install_binary_path: "{{ media_ffmpeg_dir }}/{{ item }}"
        github_release_install_use_tag_stamp: true
      # Tdarr executes only ffmpeg from here — it probes with its own bundled ffprobe at
      # /app/Tdarr_Node/assets/app/ffmpeg/linux_x64/ffprobe. ffprobe is installed anyway so
      # the pair matches the archive and is ready if Tdarr ever gains a probe-path setting.
      loop: [ffmpeg, ffprobe]

  roles:
    - configure_server
    - role: zfs_conf
      vars:
        zfs_arc_max_gb: 2
    - geerlingguy.docker
    - role: mise
    # The NVIDIA driver is deliberately not managed here. It is installed from Canonical's
    # archive and maintained by apt on the host — see docs/media-01-nvidia-driver.md.
    - role: nvidia_container_toolkit
    - role: power_saving
      vars:
        power_saving_configure_cpu: false
    - role: beszel_agent
    - role: docker_compose_traefik
      vars:
        docker_compose_traefik_enable_dashboard: true
        docker_compose_traefik_enable_host_network: true
      tags: traefik
    - docker_compose_dashboard_services_manager_provider
    - docker_compose_diun
    - role: docker_compose_immich
      vars:
        immich_only_machine_learning: true
        immich_machine_learning_cuda: true
        immich_machine_learning_model_cache_directory: "{{ (docker_compose_dst_data_directory_path, 'immich/model_cache') | path_join }}"
    # - role: docker_compose_obico
    #   vars:
    #     obico_only_machine_learning: true
    #     obico_machine_learning_cuda: true
    #     docker_compose_envs:
    #       OBICO_ML_API_TOKEN: "{{ obico_ml_api_token }}"
    - role: docker_compose
      vars:
        docker_compose_src_file_path: files/media-01/docker-compose-ai.yml
    # Speech-to-text for Home Assistant's Assist pipeline, over the Wyoming TCP protocol
    # on 10300. Here rather than jetson-01, whose own Wyoming stack is untouched: that one
    # runs a locally-built aarch64 Tegra image, and this one is published linux/amd64 only.
    - role: docker_compose_wyoming_faster_whisper
      vars:
        wyoming_faster_whisper_model: turbo
        # compute-type is pinned rather than left at upstream's `default`, which resolves
        # per-device: the A4000 is shared with Immich ML, the Onyx model servers and Tdarr,
        # so the smaller int8_float16 footprint matters more than the marginal accuracy.
        # --language pins English so faster-whisper skips per-utterance detection.
        wyoming_faster_whisper_extra_params: >-
          --compute-type int8_float16 --language en --beam-size 5 --vad-filter
      tags: whisper
    # Retrieval layer in front of llama-swap on htpc-01. Lives here rather than
    # docker-01 for the A4000: a GPU turns on multipass indexing, which indexes at two
    # chunk granularities and is the retrieval-quality lever this deployment is about.
    - role: docker_compose_onyx
      tags: onyx
    # Tdarr runs the jellyfin-ffmpeg fork build installed above, not the 7.1.4-3 bundled in
    # its image, so this host and htpc-01 encode on one build instead of two.
    #
    # Nothing is given up by the swap: the fork is a superset here. av1_nvenc, h264_nvenc,
    # hevc_nvenc, tonemap_cuda, scale_cuda and hwupload_cuda are all in it, built
    # --enable-cuda --enable-nvenc --enable-nvdec. The iPad-kids flow's tonemap_cuda and the
    # AV1 flows' `-preset p7 -tune uhq` both still resolve.
    #
    # The fork's nv-codec-headers pin puts the driver floor at 580 and this host runs 595.
    # That floor is a choice made on our side, not an upstream constraint — the fork is ours
    # and the header version was picked so these hosts clear it. Not a number to track.
    #
    # No restart wiring here, unlike htpc-01. Tdarr spawns ffmpeg per job, so a replaced
    # binary is picked up by the next one; restarting this container would drop every node's
    # connection and any in-flight work across the fleet to gain nothing.
    - role: docker_compose_tdarr
      vars:
        docker_compose_tdarr_server: true
        docker_compose_tdarr_custom_ffmpeg_path: "{{ media_ffmpeg_dir }}"
        docker_compose_tdarr_storage_host: nas-01
        docker_compose_tdarr_nvidia_gpu: true
        # Custom flow plugins. Listed per file rather than as a config_dir because
        # config_dirs copy verbatim while config_files template — and detectHardlinks /
        # replaceHardlinks embed the hardlink-manager URL as {{ domain_name }}.
        # The flows themselves are imported through the Tdarr UI, not deployed.
        docker_compose_src_config_files:
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/checkVideoProperties/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/checkVideoProperties/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/detectHardlinks/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/detectHardlinks/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/keepOriginalDate/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/keepOriginalDate/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/replaceHardlinks/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/replaceHardlinks/1.0.0/index.js
        # docker_compose_tdarr_hardlink_disks is set in host_vars/media-01/vars.yaml, from
        # storage_media_data_disks. Not repeated here: a role var would outrank the host var
        # and the test could no longer see the value this play uses.
      tags: tdarr
    # Commented out — competes with kohya_ss for the A4000; enable one at a time.
    #
    # swarmui MUST come before comfyui: comfyui_extra_custom_nodes below points into
    # swarmui's git clone, and Compose resolves those paths relative to the compose
    # directory both roles deploy into.
    # - role: docker_compose_swarmui
    #   vars:
    #     swarmui_extra_networks: [openwebui]
    #     # Share comfyui's model store rather than downloading a second copy.
    #     swarmui_models_path: "{{ docker_compose_dst_data_directory_path }}/comfyui/models"
    # - role: docker_compose_comfyui
    #   vars:
    #     comfyui_extra_networks: [openwebui]
    #     comfyui_output_share: "//nas-01.{{ domain_name }}/{{ nas_01_ai_image_path }}"
    #     comfyui_output_volume_name: nas-01_ai_images
    #     comfyui_smb_username: "{{ smb_nas_01_username }}"
    #     comfyui_smb_password: "{{ smb_nas_01_password }}"
    #     comfyui_smb_uid: "{{ smb_nas_01_uid }}"
    #     comfyui_smb_gid: "{{ smb_nas_01_gid }}"
    #     # Compose-relative paths into swarmui's clone; see the ordering note above.
    #     comfyui_extra_custom_nodes:
    #       - source: ./swarmui/src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon
    #         name: SwarmComfyCommon
    #       - source: ./swarmui/src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyExtra
    #         name: SwarmComfyExtra
    - role: docker_compose_kohya_ss
      vars:
        # Share comfyui's model store rather than keeping a second copy.
        kohya_ss_models_path: "{{ docker_compose_dst_data_directory_path }}/comfyui/models"
      tags: kohya_ss
    - role: docker_compose
      vars:
        docker_compose_copy_scripts: true
        docker_compose_src_file_path: files/media-01/docker-compose-media.yml
        docker_compose_envs:
          PLEX_CLAIM_TOKEN: "{{ plex_claim_token }}"
          SMB_STORAGE_USERNAME: "{{ smb_nas_01_username }}"
          SMB_STORAGE_PASSWORD: "{{ smb_nas_01_password }}"
          SMB_STORAGE_UID: "{{ smb_nas_01_uid }}"
          SMB_STORAGE_GID: "{{ smb_nas_01_gid }}"
