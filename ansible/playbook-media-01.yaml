---
- name: Configure media-01
  hosts: media-01
  become: true

  vars:
    docker_compose_dst_data_directory_path: /mnt/data

    # Custom ffmpeg for Tdarr, bind-mounted into the container at /ffmpeg. A dedicated
    # directory rather than /usr/local/bin because the whole directory is mounted and must
    # hold nothing else. Same path as htpc-01, deliberately — the two hosts run one build.
    media_ffmpeg_dir: /opt/jellyfin-ffmpeg/bin

    # The Arc B580's render node, for QSV in jellyfin, plex and tdarr. Referenced from
    # files/media-01/docker-compose-media.yml too — that file goes through
    # ansible.builtin.template regardless of its extension, so Jinja renders in it.
    #
    # by-path, not renderD*: this host has two GPUs and the numbering follows driver probe
    # order. renderD128 is the Arc and renderD129 the A4000 today, but that is not guaranteed
    # across a reboot. The PCI address is fixed by hostpci1 in the VM config, so this name is.
    #
    # Only usable since the 26.04 upgrade — kernel 6.8 predated `xe` support for Battlemage
    # and the card enumerated on the PCI bus with no DRM node at all.
    media_intel_render_device: /dev/dri/by-path/pci-0000:02:00.0-render

  pre_tasks:
    # Tagged so the kernel can be installed on its own with `--tags kernel` and its DKMS build
    # checked before the reboot that activates it. `--tags` runs only tagged tasks, so nothing
    # else in this play fires on that run.
    - name: Install packages
      ansible.builtin.package:
        name:
          # Pulls linux-modules-extra. The note here used to say that was for the CIFS module;
          # that is wrong — cifs.ko and zfs.ko both ship in linux-modules-*, not -extra
          # (`dpkg -S` on 6.8.0-137 confirms). Left installed anyway: nothing has established
          # what else on this host needs -extra, and finding out is not this change's job.
          - linux-image-generic
          - zfsutils-linux
          - cifs-utils
          - nvtop
      tags: kernel

    # The ffmpeg Tdarr actually runs. Installed on the host and mounted read-only rather
    # than baked into the image, so the encoder and the container upgrade separately.
    # pre_tasks, because the mount source has to exist before docker_compose_tdarr brings
    # the container up down in `roles:`.
    #
    # root-owned, unlike htpc-01: there the directory is chowned to the Tdarr PUID because
    # podman_quadlet chowns every Volume= source. Docker bind-mounts do no such thing, and
    # this one is :ro.
    - name: Create jellyfin-ffmpeg directory
      tags: [tdarr, ffmpeg]
      ansible.builtin.file:
        path: "{{ media_ffmpeg_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # use_tag_stamp, not the `echo <tag>` idiom: this build reports 8.1.2-Jellyfin while the
    # release is tagged v8.1.2-2+nvenc-n13.0.19.1, so no regex over `ffmpeg -version` can
    # ever equal the tag. The stamp also carries the asset digest, which is what makes this
    # fork tractable at all — it republishes assets under an unchanged tag, and a tag-only
    # comparison would install once and then believe itself converged forever.
    - name: Install jellyfin-ffmpeg (fork build with av1_nvenc tune uhq and tonemap_cuda)
      tags: [tdarr, ffmpeg]
      ansible.builtin.include_role:
        name: github_release_install
        apply:
          tags: [tdarr, ffmpeg]
      vars:
        github_release_install_repo: andyattebery/jellyfin-ffmpeg
        github_release_install_asset_patterns:
          x86_64: 'linux64-gpl\.tar\.xz$'
        github_release_install_archive_type: tarball
        github_release_install_binary_in_archive: "{{ item }}"
        github_release_install_binary_path: "{{ media_ffmpeg_dir }}/{{ item }}"
        github_release_install_use_tag_stamp: true
      # Tdarr executes only ffmpeg from here — it probes with its own bundled ffprobe at
      # /app/Tdarr_Node/assets/app/ffmpeg/linux_x64/ffprobe. ffprobe is installed anyway so
      # the pair matches the archive and is ready if Tdarr ever gains a probe-path setting.
      loop: [ffmpeg, ffprobe]

  roles:
    - configure_server
    # 8 GiB, and the number is headroom rather than measured need. During a transcoding settings
    # sweep the ARC served 11.55 GiB of demand reads in 30s with ZERO disk reads and a single
    # miss, at the old 2 GiB cap — the working set being re-read already fits. 8 GiB is 4x that,
    # covering demand metadata (95.7% hit rate, the only figure with room) and a sweep that grows
    # to several source files at once.
    #
    # NOT uncapped. On ZFS 2.4.1 `zfs_arc_max=0` is not 50% of RAM — that held through 2.2, and
    # from 2.4 the Linux/FreeBSD split is gone and the default becomes "the larger of
    # all_system_memory - 1 GiB and 5/8 x all_system_memory", i.e. effectively RAM minus 1 GiB.
    # On this VM that would be an ARC larger than every container's peak combined, with no swap
    # to absorb the collision.
    #
    # Sized against 48 GiB of RAM: container high-water marks sum to 26.4 GiB (cgroup v2
    # memory.peak across 24 containers) plus ~1.5 GiB host overhead, leaving ~12 GiB free.
    # See plans/media-01-ram-and-arc-sizing.md.
    - role: zfs_conf
      tags: zfs
      vars:
        zfs_arc_max_gb: 8
    - geerlingguy.docker
    - role: mise
    # Adopted 2026-08-24: the playbook now owns the driver, at the package set the host was
    # already running. `-driver-` and not `-headless-` is deliberate and load-bearing — the
    # headless metapackage drops libnvidia-encode/decode, which Plex and Tdarr need injected
    # into their containers. See docs/media-01-nvidia-driver.md and the role README.
    - role: nvidia_driver
      tags: nvidia
      vars:
        nvidia_driver_branch: "595"
    - role: nvidia_container_toolkit
    - role: power_saving
      vars:
        power_saving_configure_cpu: false
    - role: beszel_agent
    - role: docker_compose_traefik
      vars:
        docker_compose_traefik_enable_dashboard: true
        docker_compose_traefik_enable_host_network: true
      tags: traefik
    - docker_compose_dashboard_services_manager_provider
    - docker_compose_diun
    - role: docker_compose_immich
      vars:
        immich_only_machine_learning: true
        immich_machine_learning_cuda: true
        immich_machine_learning_model_cache_directory: "{{ (docker_compose_dst_data_directory_path, 'immich/model_cache') | path_join }}"
    # - role: docker_compose_obico
    #   vars:
    #     obico_only_machine_learning: true
    #     obico_machine_learning_cuda: true
    #     docker_compose_envs:
    #       OBICO_ML_API_TOKEN: "{{ obico_ml_api_token }}"
    - role: docker_compose
      vars:
        docker_compose_src_file_path: files/media-01/docker-compose-ai.yml
    # Speech-to-text for Home Assistant's Assist pipeline, over the Wyoming TCP protocol
    # on 10300. Here rather than jetson-01, whose own Wyoming stack is untouched: that one
    # runs a locally-built aarch64 Tegra image, and this one is published linux/amd64 only.
    - role: docker_compose_wyoming_faster_whisper
      vars:
        wyoming_faster_whisper_model: turbo
        # compute-type is pinned rather than left at upstream's `default`, which resolves
        # per-device: the A4000 is shared with Immich ML, the Onyx model servers and Tdarr,
        # so the smaller int8_float16 footprint matters more than the marginal accuracy.
        # --language pins English so faster-whisper skips per-utterance detection.
        wyoming_faster_whisper_extra_params: >-
          --compute-type int8_float16 --language en --beam-size 5 --vad-filter
      tags: whisper
    # Retrieval layer in front of llama-swap on htpc-01. Lives here rather than
    # docker-01 for the A4000: a GPU turns on multipass indexing, which indexes at two
    # chunk granularities and is the retrieval-quality lever this deployment is about.
    - role: docker_compose_onyx
      tags: onyx
    # Tdarr runs the jellyfin-ffmpeg fork build installed above, not the 7.1.4-3 bundled in
    # its image, so this host and htpc-01 encode on one build instead of two.
    #
    # Nothing is given up by the swap: the fork is a superset here. av1_nvenc, h264_nvenc,
    # hevc_nvenc, tonemap_cuda, scale_cuda and hwupload_cuda are all in it, built
    # --enable-cuda --enable-nvenc --enable-nvdec. The iPad-kids flow's tonemap_cuda and the
    # AV1 flows' `-preset p7 -tune uhq` both still resolve.
    #
    # The fork's nv-codec-headers pin puts the driver floor at 580 and this host runs 595.
    # That floor is a choice made on our side, not an upstream constraint — the fork is ours
    # and the header version was picked so these hosts clear it. Not a number to track.
    #
    # No restart wiring here, unlike htpc-01. Tdarr spawns ffmpeg per job, so a replaced
    # binary is picked up by the next one; restarting this container would drop every node's
    # connection and any in-flight work across the fleet to gain nothing.
    - role: docker_compose_tdarr
      vars:
        docker_compose_tdarr_component: server
        docker_compose_tdarr_custom_ffmpeg_path: "{{ media_ffmpeg_dir }}"
        docker_compose_tdarr_storage_host: nas-01
        docker_compose_tdarr_smb_username: "{{ smb_nas_01_username }}"
        docker_compose_tdarr_smb_password: "{{ smb_nas_01_password }}"
        docker_compose_tdarr_smb_uid: "{{ smb_nas_01_uid }}"
        docker_compose_tdarr_smb_gid: "{{ smb_nas_01_gid }}"

        # This host runs the role twice, so each invocation needs its own .env namespace — see
        # the role's README, "One host running both server and node". Without it the node
        # invocation, running later, would redefine this one's worker counts and nodeName.
        docker_compose_tdarr_env_suffix: _SERVER

        # The Arc B580 is this component's card. The A4000 belongs to the node in `tasks:` at the
        # end of this play: one card per component, so a flow routed at one cannot land on the
        # other. See media_intel_render_device above for why the Arc is addressed by-path — and
        # note the role emits that variable nowhere, it records intent for the Tdarr UI.
        docker_compose_tdarr_intel_gpu: true
        docker_compose_tdarr_nvidia_gpu: false
        docker_compose_tdarr_intel_render_device: "{{ media_intel_render_device }}"

        # The internal node's worker counts, taken off the Tdarr UI and into this file.
        #
        # One GPU transcode worker, no CPU one — the count the iPad-kids recipe gives this host.
        # Type is a gate, not a label: a CPU transcode worker refuses any job whose ffmpeg
        # arguments contain nvenc/cuda/vaapi, so a CPU-only node would register, report healthy,
        # and take nothing from a hardware-accelerated library.
        #
        # Deliberately NOT zeroed. This node transcodes on the Arc while the A4000 node adds
        # concurrency; pausing either one in the Tdarr UI is the off switch, which is a per-job
        # decision and does not belong hard-coded here.
        #
        # manage_workers is opt-in per host because turning it on ADOPTS the four values below
        # over whatever the UI held — Tdarr's precedence is environment variables first. That is
        # wanted here, and is not a safe default for a server nobody has chosen counts for.
        docker_compose_tdarr_server_manage_workers: true
        docker_compose_tdarr_transcode_gpu_workers: 1
        docker_compose_tdarr_transcode_cpu_workers: 0
        docker_compose_tdarr_healthcheck_gpu_workers: 0
        docker_compose_tdarr_healthcheck_cpu_workers: 1
        # Custom flow plugins. Listed per file rather than as a config_dir because
        # config_dirs copy verbatim while config_files template — and detectHardlinks /
        # replaceHardlinks embed the hardlink-manager URL as {{ domain_name }}.
        # The flows themselves are imported through the Tdarr UI, not deployed.
        docker_compose_src_config_files:
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/checkNodeTag/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/checkNodeTag/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/checkVideoProperties/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/checkVideoProperties/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/detectHardlinks/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/detectHardlinks/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/keepOriginalDate/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/keepOriginalDate/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/replaceHardlinks/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/replaceHardlinks/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/selectOutputStreams/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/selectOutputStreams/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/setScaledGeometry/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/setScaledGeometry/1.0.0/index.js
        # docker_compose_tdarr_hardlink_disks is set in host_vars/media-01/vars.yaml, from
        # storage_media_data_disks. Not repeated here: a role var would outrank the host var
        # and the test could no longer see the value this play uses.
      tags: tdarr
    # Commented out — competes with kohya_ss for the A4000; enable one at a time.
    #
    # swarmui MUST come before comfyui: comfyui_extra_custom_nodes below points into
    # swarmui's git clone, and Compose resolves those paths relative to the compose
    # directory both roles deploy into.
    # - role: docker_compose_swarmui
    #   vars:
    #     swarmui_extra_networks: [openwebui]
    #     # Share comfyui's model store rather than downloading a second copy.
    #     swarmui_models_path: "{{ docker_compose_dst_data_directory_path }}/comfyui/models"
    # - role: docker_compose_comfyui
    #   vars:
    #     comfyui_extra_networks: [openwebui]
    #     comfyui_output_share: "//nas-01.{{ domain_name }}/{{ nas_01_ai_image_path }}"
    #     comfyui_output_volume_name: nas-01_ai_images
    #     comfyui_smb_username: "{{ smb_nas_01_username }}"
    #     comfyui_smb_password: "{{ smb_nas_01_password }}"
    #     comfyui_smb_uid: "{{ smb_nas_01_uid }}"
    #     comfyui_smb_gid: "{{ smb_nas_01_gid }}"
    #     # Compose-relative paths into swarmui's clone; see the ordering note above.
    #     comfyui_extra_custom_nodes:
    #       - source: ./swarmui/src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon
    #         name: SwarmComfyCommon
    #       - source: ./swarmui/src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyExtra
    #         name: SwarmComfyExtra
    - role: docker_compose_kohya_ss
      vars:
        # Share comfyui's model store rather than keeping a second copy.
        kohya_ss_models_path: "{{ docker_compose_dst_data_directory_path }}/comfyui/models"
      tags: kohya_ss
    - role: docker_compose
      tags: media
      vars:
        docker_compose_copy_scripts: true
        docker_compose_src_file_path: files/media-01/docker-compose-media.yml
        docker_compose_envs:
          PLEX_CLAIM_TOKEN: "{{ plex_claim_token }}"
          SMB_STORAGE_USERNAME: "{{ smb_nas_01_username }}"
          SMB_STORAGE_PASSWORD: "{{ smb_nas_01_password }}"
          SMB_STORAGE_UID: "{{ smb_nas_01_uid }}"
          SMB_STORAGE_GID: "{{ smb_nas_01_gid }}"

  tasks:
    # The A4000 transcode node — a second deployment of docker_compose_tdarr against the same host
    # as the server above. The server holds the Arc; this one holds the NVIDIA card, so each
    # component reaches exactly one and a flow routed at one cannot land on the other.
    #
    # It is here rather than in `roles:` because the role has no meta/main.yml: a role listed
    # twice under `roles:` runs ONCE, so the second entry would be skipped silently and the node
    # would never deploy. include_role has no such dedup, and is how wsl-01 invokes this role.
    # `tasks:` also runs after `roles:`, which is the ordering wanted — the server is up before
    # the node registers against it.
    # `apply:` is load-bearing, not decoration. include_role does NOT pass this task's tags down to
    # the included role's tasks, so under `--tags tdarr` the include runs and everything inside it
    # is filtered out -- the node silently does not deploy and the play still reports success.
    # That is exactly what happened on the first 2026-09-01 deploy. The github_release_install
    # include earlier in this file carries the same `apply:` for the same reason.
    - name: Deploy the A4000 Tdarr node
      tags: tdarr
      ansible.builtin.include_role:
        name: docker_compose_tdarr
        apply:
          tags: tdarr
      vars:
        docker_compose_tdarr_component: node
        docker_compose_tdarr_node_name: media-01-a4000
        docker_compose_tdarr_storage_host: nas-01
        docker_compose_tdarr_smb_username: "{{ smb_nas_01_username }}"
        docker_compose_tdarr_smb_password: "{{ smb_nas_01_password }}"
        docker_compose_tdarr_smb_uid: "{{ smb_nas_01_uid }}"
        docker_compose_tdarr_smb_gid: "{{ smb_nas_01_gid }}"

        # The second .env namespace on this host; the server invocation above takes _SERVER.
        # Without a distinct suffix this invocation, running later, would redefine the server's
        # worker counts and nodeName — `.env` is host-global and merged, never rewritten.
        docker_compose_tdarr_env_suffix: _NODE

        # The A4000. No Intel wiring here: the Arc belongs to the server component.
        docker_compose_tdarr_nvidia_gpu: true

        # The same jellyfin-ffmpeg fork build the server runs, not the image's bundled ffmpeg.
        # It carries the NVENC half as well as the VAAPI one — av1_nvenc, hevc_nvenc and
        # tonemap_cuda are all in it, which is what this node encodes with.
        docker_compose_tdarr_custom_ffmpeg_path: "{{ media_ffmpeg_dir }}"

        # A GPU transcode worker on the A4000, adding concurrency alongside the server's Arc
        # worker. Pause this node in the Tdarr UI when the card is wanted for ML.
        #
        # Type is a gate, not a label: a CPU transcode worker refuses any job whose ffmpeg
        # arguments contain nvenc/cuda/vaapi, so a CPU-only node would register, report healthy,
        # and take nothing from a hardware-accelerated library.
        docker_compose_tdarr_transcode_gpu_workers: 1
        docker_compose_tdarr_transcode_cpu_workers: 0
        docker_compose_tdarr_healthcheck_gpu_workers: 0
        docker_compose_tdarr_healthcheck_cpu_workers: 1

        # Not passed, deliberately:
        #
        #   docker_compose_tdarr_server_ip — the role default tdarr.{{ domain_name }} is what
        #     wsl-01, eta and htpc-01 all use, so that name serves 8266. From a container on this
        #     host it reaches a published host port through the bridge; no router hairpin.
        #
        #   docker_compose_tdarr_hardlink_disks — set in host_vars/media-01/vars.yaml from
        #     storage_media_data_disks, and inherited here. Passing it would make it a role var
        #     outranking the host var, the same reason the server invocation does not repeat it.
