---
- name: Configure nas
  hosts: media-01
  become: true

  vars:
    docker_compose_dst_data_directory_path: /mnt/data

  pre_tasks:
    - name: Install packages
      ansible.builtin.package:
        name:
          - linux-image-generic # Install linux-modules-extra for the CIFS module
          - zfsutils-linux
          - cifs-utils
          - nvtop

  roles:
    - configure_server
    - role: zfs_conf
      vars:
        zfs_arc_max_gb: 2
    - geerlingguy.docker
    - role: mise
    - role: nvidia.nvidia_driver
      vars:
        nvidia_driver_branch: "580"
        nvidia_driver_ubuntu_cuda_keyring_package: cuda-keyring_1.1-1_all.deb
        nvidia_driver_ubuntu_install_from_cuda_repo: true
        nvidia_driver_add_repos: true
        nvidia_driver_skip_reboot: true
    - role: nvidia_container_toolkit
    - role: power_saving
      vars:
        power_saving_configure_cpu: false
    - role: beszel_agent
    - role: docker_compose_traefik
      vars:
        docker_compose_traefik_enable_dashboard: true
        docker_compose_traefik_enable_host_network: true
      tags: traefik
    - docker_compose_dashboard_services_manager_provider
    - docker_compose_diun
    - role: docker_compose_immich
      vars:
        immich_only_machine_learning: true
        immich_machine_learning_cuda: true
        immich_machine_learning_model_cache_directory: "{{ (docker_compose_dst_data_directory_path, 'immich/model_cache') | path_join }}"
    # - role: docker_compose_obico
    #   vars:
    #     obico_only_machine_learning: true
    #     obico_machine_learning_cuda: true
    #     docker_compose_envs:
    #       OBICO_ML_API_TOKEN: "{{ obico_ml_api_token }}"
    - role: docker_compose
      vars:
        docker_compose_src_file_path: files/media-01/docker-compose-ai.yml
    # Retrieval layer in front of llama-swap on htpc-01. Lives here rather than
    # docker-01 for the A4000: a GPU turns on multipass indexing, which indexes at two
    # chunk granularities and is the retrieval-quality lever this deployment is about.
    - role: docker_compose_onyx
      tags: onyx
    # Tdarr uses the ffmpeg shipped inside its own container (jellyfin-ffmpeg 7.1.4-3,
    # /usr/lib/jellyfin-ffmpeg/ffmpeg). The iPad-kids flow tonemaps with tonemap_cuda,
    # which is a jellyfin-only filter, so no custom ffmpeg is mounted here and there is
    # no NVENC-API/driver pin to maintain. wsl-01 still installs BtbN for av1_nvenc.
    - role: docker_compose_tdarr
      vars:
        docker_compose_tdarr_server: true
        docker_compose_tdarr_storage_host: nas-01
        docker_compose_tdarr_nvidia_gpu: true
        # Custom flow plugins. Listed per file rather than as a config_dir because
        # config_dirs copy verbatim while config_files template — and detectHardlinks /
        # replaceHardlinks embed the hardlink-manager URL as {{ domain_name }}.
        # The flows themselves are imported through the Tdarr UI, not deployed.
        docker_compose_src_config_files:
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/checkVideoProperties/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/checkVideoProperties/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/detectHardlinks/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/detectHardlinks/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/keepOriginalDate/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/keepOriginalDate/1.0.0/index.js
          - src_file_path: files/media-01/tdarr/tdarr-plugins/FlowPlugins/LocalFlowPlugins/tools/replaceHardlinks/1.0.0/index.js
            dst_relative_file_path: tdarr/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/tools/replaceHardlinks/1.0.0/index.js
        docker_compose_tdarr_hardlink_disks:
          - data01
          - data02
          - data03
          - data08
          - data11
          - data12
      tags: tdarr
    # Commented out — competes with kohya_ss for the A4000; enable one at a time.
    #
    # swarmui MUST come before comfyui: comfyui_extra_custom_nodes below points into
    # swarmui's git clone, and Compose resolves those paths relative to the compose
    # directory both roles deploy into.
    # - role: docker_compose_swarmui
    #   vars:
    #     swarmui_extra_networks: [openwebui]
    #     # Share comfyui's model store rather than downloading a second copy.
    #     swarmui_models_path: "{{ docker_compose_dst_data_directory_path }}/comfyui/models"
    # - role: docker_compose_comfyui
    #   vars:
    #     comfyui_extra_networks: [openwebui]
    #     comfyui_output_share: "//nas-01.{{ domain_name }}/{{ nas_01_ai_image_path }}"
    #     comfyui_output_volume_name: nas-01_ai_images
    #     comfyui_smb_username: "{{ smb_nas_01_username }}"
    #     comfyui_smb_password: "{{ smb_nas_01_password }}"
    #     comfyui_smb_uid: "{{ smb_nas_01_uid }}"
    #     comfyui_smb_gid: "{{ smb_nas_01_gid }}"
    #     # Compose-relative paths into swarmui's clone; see the ordering note above.
    #     comfyui_extra_custom_nodes:
    #       - source: ./swarmui/src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon
    #         name: SwarmComfyCommon
    #       - source: ./swarmui/src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyExtra
    #         name: SwarmComfyExtra
    - role: docker_compose_kohya_ss
      vars:
        # Share comfyui's model store rather than keeping a second copy.
        kohya_ss_models_path: "{{ docker_compose_dst_data_directory_path }}/comfyui/models"
      tags: kohya_ss
    - role: docker_compose
      vars:
        docker_compose_copy_scripts: true
        docker_compose_src_file_path: files/media-01/docker-compose-media.yml
        docker_compose_envs:
          PLEX_CLAIM_TOKEN: "{{ plex_claim_token }}"
          SMB_STORAGE_USERNAME: "{{ smb_nas_01_username }}"
          SMB_STORAGE_PASSWORD: "{{ smb_nas_01_password }}"
          SMB_STORAGE_UID: "{{ smb_nas_01_uid }}"
          SMB_STORAGE_GID: "{{ smb_nas_01_gid }}"
