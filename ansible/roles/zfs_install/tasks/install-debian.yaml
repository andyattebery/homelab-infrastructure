---
- name: Configure the backports apt source
  ansible.builtin.include_tasks: apt_repo.yaml

- name: Make backports repo higher priority
  ansible.builtin.template:
    src: apt_preferences_zfs.j2
    dest: /etc/apt/preferences.d/90_zfs
    mode: "0644"
    owner: root
    group: root

- name: Install zfs
  ansible.builtin.apt:
    name:
      - zfs-dkms
      - zfsutils-linux
    update_cache: true
