---
# Resolve an interface name from a MAC. Defined here rather than as a set_fact so
# it re-evaluates per loop iteration and never leaks into play scope.
#
# Set `_pve_pin_lookup_mac` in the consuming task's `vars:`.
#
# `type == 'ether'` is load-bearing: a bridge inherits the MAC of its port, so
# vmbr0 and its uplink NIC share a MAC. Without this filter the lookup can return
# the bridge, and `pve-network-interface-pinning --interface vmbr0` fails with
# "Could not find link with name 'vmbr0'". Bridges are type 'bridge', bonds are
# type 'bond'; only real NICs are type 'ether'.
_pve_pin_matching_nics: >-
  {{ ansible_facts['interfaces']
     | map('extract', ansible_facts)
     | selectattr('macaddress', 'defined')
     | selectattr('macaddress', 'eq', _pve_pin_lookup_mac)
     | selectattr('type', 'defined')
     | selectattr('type', 'eq', 'ether')
     | map(attribute='device') | list }}

# Empty unless exactly one physical interface matched. Ambiguity must fail loudly
# rather than be resolved by picking the first result.
_pve_pin_resolved_nic_name: >-
  {{ (_pve_pin_matching_nics | first)
     if (_pve_pin_matching_nics | length == 1) else '' }}
