---
podman_quadlet_volume_owner: "{{ ansible_user }}"
podman_quadlet_volume_group: "{{ ansible_user }}"
podman_quadlet_config_files: []

# Service lifecycle. Defaults are computed per quadlet type in tasks/main.yaml:
# .container and .kube generate a service with an [Install] section and are enabled;
# .network, .volume, .pod, .image, .build and .artifact are pulled in as dependencies
# of the units that reference them and have no [Install], so enabling them fails.
# Override either to deploy a unit without starting it.
podman_quadlet_service_state: started
podman_quadlet_service_enabled: ~

# Command prefix pqup re-execs itself under, inserted verbatim before the script's own path,
# so the whole run (pulls, auto-update, prune) happens inside it. Empty means pqup runs as
# is. Meant for a sleep hold on a host that autosuspends — on any systemd host
# `systemd-inhibit --what=sleep --who=pqup --why=pqup` works; a host with its own hold CLI
# passes that. The prefix must exist on the host: if it does not, pqup fails at the exec
# before pulling anything.
podman_quadlet_pqup_wrapper: ""
