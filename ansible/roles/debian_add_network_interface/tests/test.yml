---
# Exercises debian_add_network_interface against a tempdir and a stub ifreload.
# Runs entirely on localhost; touches no remote host.
#
#   cd ansible
#   ANSIBLE_VAULT_PASSWORD_FILE=tests/apt-sources/no-vault.sh \
#     .venv/bin/ansible-playbook -i roles/debian_add_network_interface/tests/inventory \
#     roles/debian_add_network_interface/tests/test.yml
- name: Test debian_add_network_interface
  hosts: localhost
  gather_facts: true

  tasks:
    - name: Create a scratch directory
      ansible.builtin.tempfile:
        state: directory
        suffix: debian-add-nic-tests
      register: _tmp

    - name: Run the suite
      block:
        - name: Install a stub ifreload
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/ifreload"
            mode: "0755"
            content: |
              #!/bin/sh
              echo "$@" >> "$(dirname "$0")/calls.log"

        - name: Start with an empty call log
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/calls.log"
            content: ""
            mode: "0644"

        - name: Pick two real local interfaces to stand in for NICs
          ansible.builtin.set_fact:
            _probes: >-
              {{ (ansible_facts['interfaces'] | map('extract', ansible_facts)
                  | selectattr('macaddress', 'defined')
                  | selectattr('type', 'defined')
                  | selectattr('type', 'eq', 'ether')
                  | selectattr('device', 'defined') | list)[:2] }}

        - name: Require two usable probe interfaces
          ansible.builtin.assert:
            that:
              - _probes | length == 2
              - _probes[0].macaddress != _probes[1].macaddress
            fail_msg: >-
              This test needs two distinct ethernet interfaces on the control
              node to stand in for NICs. Found: {{ _probes | length }}.

        # /etc/network/interfaces as the PVE 9 installer writes it (captured from
        # vm-host-02, 2026-09-08): a bare stanza per NIC, tabs in the bridge
        # block, the source line last. Probe 0 stands in for the Ceph NIC, probe
        # 1 for the vmbr0 uplink.
        - name: Seed the installer's interfaces file
          vars:
            _seed: |
              # network interface settings; autogenerated
              # Please do NOT modify this file directly, unless you know what
              # you're doing.
              #
              # If you want to manage parts of the network configuration manually,
              # please utilize the 'source' or 'source-directory' directives to do
              # so.
              # PVE will preserve these directives, but will NOT read its network
              # configuration from sourced files, so do not attempt to move any of
              # the PVE managed interfaces into external files!

              auto lo
              iface lo inet loopback



              iface {{ _probes[0].device }} inet manual

              iface {{ _probes[1].device }} inet manual

              auto vmbr0
              iface vmbr0 inet static
              	address 192.168.1.242/24
              	gateway 192.168.1.1
              	bridge-ports {{ _probes[1].device }}
              	bridge-stp off
              	bridge-fd 0

              source {{ _tmp.path }}/interfaces.d/*
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/interfaces"
            content: "{{ _seed }}"
            mode: "0644"

        - name: Remember the seed
          ansible.builtin.slurp:
            src: "{{ _tmp.path }}/interfaces"
          register: _seeded

        # ---------- 1. the Ceph NIC on a fresh install ----------
        - name: Configure the first probe as the Ceph NIC
          vars:
            debian_add_network_interface_interfaces_file: "{{ _tmp.path }}/interfaces"
            debian_add_network_interface_interfaces_d: "{{ _tmp.path }}/interfaces.d"
            debian_add_network_interface_ifreload: "{{ _tmp.path }}/ifreload"
            debian_add_network_interface_filename: ceph-cluster
            debian_add_network_interface_mac: "{{ _probes[0].macaddress | upper }}"   # upper-case on purpose
            debian_add_network_interface_method: static
            debian_add_network_interface_address_cidr: 10.1.40.12/24
            debian_add_network_interface_wol: pumbg
          ansible.builtin.import_role:
            name: debian_add_network_interface

        - name: Read the results
          ansible.builtin.slurp:
            src: "{{ _tmp.path }}/{{ item }}"
          loop:
            - interfaces
            - interfaces.d/ceph-cluster.cfg
            - calls.log
          register: _after1

        - name: Drop-in written, bare stanza gone, everything else byte-identical, one reload
          vars:
            _main: "{{ _after1.results[0].content | b64decode }}"
            _dropin: "{{ _after1.results[1].content | b64decode }}"
            _calls: "{{ (_after1.results[2].content | b64decode) | trim | split('\n') }}"
            _expected_main: "{{ (_seeded.content | b64decode) | replace('iface ' ~ _probes[0].device ~ ' inet manual\n\n', '') }}"
            _expected_dropin: |
              auto {{ _probes[0].device }}
              iface {{ _probes[0].device }} inet static
                  address 10.1.40.12/24
                  ethernet-wol pumbg
          ansible.builtin.assert:
            that:
              - _dropin == _expected_dropin
              - _main == _expected_main
              - "'iface ' ~ _probes[0].device ~ ' inet manual' not in _main"
              - "'iface ' ~ _probes[1].device ~ ' inet manual' in _main"
              - "'bridge-ports ' ~ _probes[1].device in _main"
              - _main | regex_findall('(?m)^source ') | length == 1
              - _calls == ['-a']
            success_msg: "drop-in ok; main file as expected; calls={{ _calls }}"

        # ---------- 2. idempotency ----------
        - name: Configure the first probe again
          vars:
            debian_add_network_interface_interfaces_file: "{{ _tmp.path }}/interfaces"
            debian_add_network_interface_interfaces_d: "{{ _tmp.path }}/interfaces.d"
            debian_add_network_interface_ifreload: "{{ _tmp.path }}/ifreload"
            debian_add_network_interface_filename: ceph-cluster
            debian_add_network_interface_mac: "{{ _probes[0].macaddress }}"
            debian_add_network_interface_method: static
            debian_add_network_interface_address_cidr: 10.1.40.12/24
            debian_add_network_interface_wol: pumbg
          ansible.builtin.import_role:
            name: debian_add_network_interface

        - name: Read the results again
          ansible.builtin.slurp:
            src: "{{ _tmp.path }}/{{ item }}"
          loop:
            - interfaces
            - calls.log
          register: _after2

        - name: Second run changes nothing and reloads nothing
          ansible.builtin.assert:
            that:
              - _after2.results[0].content == _after1.results[0].content
              - (_after2.results[1].content | b64decode) | trim | split('\n') == ['-a']
            success_msg: "no change, no second reload"

        # ---------- 3. a bridge port keeps its stanza ----------
        - name: Configure the vmbr0 uplink (dhcp) — its stanza is referenced by bridge-ports
          vars:
            debian_add_network_interface_interfaces_file: "{{ _tmp.path }}/interfaces"
            debian_add_network_interface_interfaces_d: "{{ _tmp.path }}/interfaces.d"
            debian_add_network_interface_ifreload: "{{ _tmp.path }}/ifreload"
            debian_add_network_interface_filename: uplink
            debian_add_network_interface_mac: "{{ _probes[1].macaddress }}"
            debian_add_network_interface_method: dhcp
          ansible.builtin.import_role:
            name: debian_add_network_interface

        - name: Read the main file
          ansible.builtin.slurp:
            src: "{{ _tmp.path }}/interfaces"
          register: _after3

        - name: A NIC named in bridge-ports keeps its bare stanza
          vars:
            _main: "{{ _after3.content | b64decode }}"
          ansible.builtin.assert:
            that:
              - "'iface ' ~ _probes[1].device ~ ' inet manual' in _main"
              - _after3.content == _after1.results[0].content
            success_msg: "bridge-port stanza kept"

        # ---------- 4. a stanza with options is refused ----------
        - name: Seed a main file that configures the NIC itself
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/interfaces"
            content: |
              auto lo
              iface lo inet loopback

              iface {{ _probes[0].device }} inet manual
              	mtu 9000

              source {{ _tmp.path }}/interfaces.d/*
            mode: "0644"

        - name: Reset the call log
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/calls.log"
            content: ""
            mode: "0644"

        - name: A NIC configured in the main file
          block:
            - name: Should be refused
              vars:
                debian_add_network_interface_interfaces_file: "{{ _tmp.path }}/interfaces"
                debian_add_network_interface_interfaces_d: "{{ _tmp.path }}/interfaces.d"
                debian_add_network_interface_ifreload: "{{ _tmp.path }}/ifreload"
                debian_add_network_interface_filename: configured
                debian_add_network_interface_mac: "{{ _probes[0].macaddress }}"
                debian_add_network_interface_method: dhcp
              ansible.builtin.import_role:
                name: debian_add_network_interface
            - name: Second definition should not have been accepted
              ansible.builtin.fail:
                msg: "role wrote a drop-in for a NIC the main file configures"
          rescue:
            - name: Stat the drop-in
              ansible.builtin.stat:
                path: "{{ _tmp.path }}/interfaces.d/configured.cfg"
              register: _configured
            - name: Read the call log
              ansible.builtin.slurp:
                src: "{{ _tmp.path }}/calls.log"
              register: _calls4
            - name: Refused before writing or reloading anything
              ansible.builtin.assert:
                that:
                  - "'a second definition of the same interface' in ansible_failed_result.msg"
                  - not _configured.stat.exists
                  - (_calls4.content | b64decode) | trim | length == 0
                success_msg: "refused: {{ ansible_failed_result.msg }}"

        # ---------- 5. pending network changes are refused ----------
        - name: Stage a pending network change
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/interfaces.new"
            content: "auto lo\niface lo inet loopback\n"
            mode: "0644"

        - name: With interfaces.new present
          block:
            - name: Should be refused
              vars:
                debian_add_network_interface_interfaces_file: "{{ _tmp.path }}/interfaces"
                debian_add_network_interface_interfaces_d: "{{ _tmp.path }}/interfaces.d"
                debian_add_network_interface_ifreload: "{{ _tmp.path }}/ifreload"
                debian_add_network_interface_filename: pending
                debian_add_network_interface_mac: "{{ _probes[0].macaddress }}"
                debian_add_network_interface_method: dhcp
              ansible.builtin.import_role:
                name: debian_add_network_interface
            - name: Pending change should not have been ignored
              ansible.builtin.fail:
                msg: "role ran with interfaces.new present"
          rescue:
            - name: Stat the drop-in
              ansible.builtin.stat:
                path: "{{ _tmp.path }}/interfaces.d/pending.cfg"
              register: _pending
            - name: Refused before any write
              ansible.builtin.assert:
                that:
                  - "'interfaces.new exists' in ansible_failed_result.msg"
                  - not _pending.stat.exists
                success_msg: "refused while interfaces.new exists"

        - name: Remove the pending change
          ansible.builtin.file:
            path: "{{ _tmp.path }}/interfaces.new"
            state: absent

        # ---------- 6. a missing source line is added exactly once ----------
        - name: Seed a main file with no source line
          ansible.builtin.copy:
            dest: "{{ _tmp.path }}/interfaces"
            content: |
              auto lo
              iface lo inet loopback
            mode: "0644"

        - name: Configure the first probe (dhcp) twice
          vars:
            debian_add_network_interface_interfaces_file: "{{ _tmp.path }}/interfaces"
            debian_add_network_interface_interfaces_d: "{{ _tmp.path }}/interfaces.d"
            debian_add_network_interface_ifreload: "{{ _tmp.path }}/ifreload"
            debian_add_network_interface_filename: plain
            debian_add_network_interface_mac: "{{ _probes[0].macaddress }}"
            debian_add_network_interface_method: dhcp
          ansible.builtin.include_role:
            name: debian_add_network_interface
          loop: [1, 2]

        - name: Read the main file
          ansible.builtin.slurp:
            src: "{{ _tmp.path }}/interfaces"
          register: _after6

        - name: One source line, pointing at the drop-in directory
          vars:
            _main: "{{ _after6.content | b64decode }}"
          ansible.builtin.assert:
            that:
              - _main | regex_findall('(?m)^source ') | length == 1
              - "'source ' ~ _tmp.path ~ '/interfaces.d/*' in _main"
            success_msg: "{{ _main | replace('\n', ' | ') }}"

        # ---------- 7. regression: a bridge shares its port's MAC ----------
        # Mirrors the selection chain in tasks/main.yaml. Without the type filter
        # the Ceph NIC's MAC would resolve to a bridge if it ever became one.
        - name: A bridge must never be selected over its own port
          vars:
            _facts:
              interfaces: [lo, nic0, vmbr0]
              lo: { device: lo, type: loopback }
              nic0: { device: nic0, type: ether, macaddress: "a4:bb:6d:48:0a:49" }
              vmbr0: { device: vmbr0, type: bridge, macaddress: "a4:bb:6d:48:0a:49" }
            _filtered: >-
              {{ _facts['interfaces'] | map('extract', _facts)
                 | selectattr('macaddress', 'defined')
                 | selectattr('macaddress', 'eq', 'a4:bb:6d:48:0a:49')
                 | selectattr('type', 'defined')
                 | selectattr('type', 'eq', 'ether')
                 | map(attribute='device') | list }}
          ansible.builtin.assert:
            that:
              - _filtered == ['nic0']
            success_msg: "filtered={{ _filtered }}"

      always:
        - name: Remove the scratch directory
          ansible.builtin.file:
            path: "{{ _tmp.path }}"
            state: absent
