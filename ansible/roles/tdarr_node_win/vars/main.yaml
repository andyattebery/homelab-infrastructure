---
# A complete default Tdarr_Node_Config.json, written on bootstrap so the node has something to read.
#
# Internal, not a caller input — hence vars/ rather than defaults/, which also means it cannot be
# half-overridden by accident. If one of these ever needs to vary per host, that is the moment it
# becomes a real role var.
#
# COMPLETE on purpose. All 17 keys, including the 9 the role can also manage, so the file it
# produces is valid on its own and does not depend on which tdarr_node_win_* vars a caller happens
# to have set. The merge in set_node_config.yaml is then purely an overlay of preferences.
#
# These values were taken from a REAL default config, generated by running the tray app against a
# fresh install — not reconstructed from the docs, which give serverURL as an example address and
# never mention logLevel. That file is committed as
# tests/fixtures/tdarr-node-config-default.json and case C9 of
# tests/test-tdarr-node-win-config.yml asserts this skeleton still reproduces it. Key order matches
# it, which also matches the order Tdarr writes on every subsequent save.
#
# Two keys deviate from that reference, both deliberately:
#
#   nodeName          the real default is a random friendly name ("half-hyrax"). A role cannot
#                     usefully reproduce randomness, and a provisioned node should have a
#                     predictable identity, so this is the inventory hostname. Callers override it
#                     with tdarr_node_win_node_name.
#   unmappedNodeCache the real default is <install dir>/unmappedNodeCache with FORWARD slashes.
#                     Derived here the same way rather than hardcoded, so it follows install_dir.
#                     regex_replace, not replace: Ansible does not unescape "\\" in a Jinja string
#                     literal, so replace("\\", "/") matches a doubled backslash and silently does
#                     nothing. In a regex "\\" is one escaped backslash and matches.
tdarr_node_win__config_skeleton:
  nodeName: "{{ inventory_hostname }}"
  serverURL: "http://0.0.0.0:8266"
  serverIP: "0.0.0.0"
  serverPort: "8266"
  handbrakePath: ""
  ffmpegPath: ""
  mkvpropeditPath: ""
  # One empty entry, exactly as Tdarr writes it — not an empty list.
  pathTranslators:
    - server: ""
      node: ""
  nodeType: mapped
  unmappedNodeCache: >-
    {{ tdarr_node_win_install_dir | regex_replace("\\", "/") }}/unmappedNodeCache
  # Not in the documented variable list at all, but present in every real config.
  logLevel: INFO
  priority: -1
  cronPluginUpdate: ""
  apiKey: ""
  maxLogSizeMB: 10
  pollInterval: 2000
  startPaused: false

# The only keys tdarr_node_win_workers may carry. In vars/ rather than defaults/ because it is the
# role's own constant, not something a caller sets.
__tdarr_node_win_worker_keys:
  - transcodegpuWorkers
  - transcodecpuWorkers
  - healthcheckgpuWorkers
  - healthcheckcpuWorkers
