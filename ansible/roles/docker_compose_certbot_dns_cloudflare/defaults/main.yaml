---
# Container name, not the compose service name. It is also what `service_name_to_restart` restarts.
docker_compose_certbot_dns_cloudflare_container_name: certbot
# Names the compose service, the compose file (docker-compose-<stack>.yaml) and the data directory
# under docker_compose_dst_data_directory_path. A second certbot stack on a host needs its own value
# as well as its own container name: on the default it would overwrite the first stack's compose file
# and entrypoint, and `up` would replace its container.
docker_compose_certbot_dns_cloudflare_stack_name: certbot
