---
- name: Assert tdarr node inputs are provided
  ansible.builtin.assert:
    that:
      - podman_quadlet_tdarr_server_ip | length > 0
      - podman_quadlet_tdarr_puid | string | length > 0
      - podman_quadlet_tdarr_pgid | string | length > 0
      - podman_quadlet_tdarr_data_dir | length > 0
      - podman_quadlet_tdarr_transcode_cache_dir | length > 0
    fail_msg: >-
      podman_quadlet_tdarr needs all of: podman_quadlet_tdarr_server_ip (without it the node
      retries forever and never joins the server's node list); _puid and _pgid (the identity
      Tdarr runs as, which must match the owner of the library mounts or the node can read
      the library but not write to it); _data_dir (holds the node's identity AND its pinned
      server URL); and _transcode_cache_dir (a wrong path fills whichever filesystem it
      lands on). None has a default, because every wrong value here fails silently.

- name: Assert tdarr library mounts are provided
  ansible.builtin.assert:
    that:
      - podman_quadlet_tdarr_mounts | length > 0
      - podman_quadlet_tdarr_mounts | rejectattr('src', 'defined') | list | length == 0
      - podman_quadlet_tdarr_mounts | rejectattr('dest', 'defined') | list | length == 0
    fail_msg: >-
      Set podman_quadlet_tdarr_mounts to at least one {src, dest} entry. A node with nothing
      mounted registers, reports healthy and processes nothing. `dest` is not free choice:
      nodeType=mapped means the server hands this node absolute paths from its own view, so
      each dest must be the path the SERVER uses for that data.

- name: Create tdarr node directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ podman_quadlet_tdarr_puid }}"
    group: "{{ podman_quadlet_tdarr_pgid }}"
    mode: "0755"
  loop:
    - "{{ podman_quadlet_tdarr_data_dir }}"
    - "{{ podman_quadlet_tdarr_transcode_cache_dir }}"

# NOT redundant with the container's RequiresMountsFor=, which does not catch this.
# systemd.unit(5) on RequiresMountsFor: it "adds dependencies of type Requires= and After=
# for all mount units required to access the specified path". A path that is not itself a
# mount point therefore resolves to the nearest PARENT mount, which exists — so the unit
# starts cleanly against an empty directory and the node scans an empty library.
#
# Worse, the podman_quadlet role creates a directory for every Volume= bind source, so an
# unmounted path gets silently mkdir-ed on the way past. This check has to run before that.
#
# `mountpoint -q` is the idiom this repo already uses to guard a data drive before deploying
# containers onto it.
- name: Test whether tdarr library mounts are mounted
  ansible.builtin.command:
    cmd: "mountpoint -q {{ item.src }}"
  changed_when: false
  failed_when: false
  loop: "{{ podman_quadlet_tdarr_mounts }}"
  loop_control:
    label: "{{ item.src }}"
  register: __podman_quadlet_tdarr_mountpoint

# Owner, not just mountedness. This role used to mount the shares itself and reused PUID/PGID
# for the CIFS uid=/gid=, so the two identities could not drift by construction. Mounting now
# belongs to the caller, so that guarantee is gone and is replaced by checking the real thing:
# a mount owned by someone else is not a mount failure, it is a node that reads the library and
# cannot write to it, which surfaces much later as a flow failure.
- name: Read the owner of each tdarr library mount
  ansible.builtin.stat:
    path: "{{ item.src }}"
  loop: "{{ podman_quadlet_tdarr_mounts }}"
  loop_control:
    label: "{{ item.src }}"
  register: __podman_quadlet_tdarr_owner

- name: Assert tdarr library mounts are mounted
  vars:
    __unmounted: >-
      {{ __podman_quadlet_tdarr_mountpoint.results
         | selectattr('rc', 'ne', 0) | map(attribute='item.src') | list }}
  ansible.builtin.assert:
    that: __unmounted | length == 0
    fail_msg: >-
      Not mounted: {{ __unmounted | join(', ') }}.
      Mounting these is the caller's job and it has not happened — mount them before this role
      runs, typically with the systemd_cifs_mount role. Check `systemctl status` for the
      corresponding *.mount unit, and the credentials it points at.

- name: Assert tdarr library mounts are owned by the PUID
  vars:
    __wrong_owner: >-
      {{ __podman_quadlet_tdarr_owner.results
         | selectattr('stat.exists')
         | rejectattr('stat.uid', 'equalto', podman_quadlet_tdarr_puid | int)
         | map(attribute='item.src') | list }}
  ansible.builtin.assert:
    that: __wrong_owner | length == 0
    fail_msg: >-
      Owned by the wrong uid: {{ __wrong_owner | join(', ') }}.
      podman_quadlet_tdarr_puid is {{ podman_quadlet_tdarr_puid }}, so the node runs as that
      user and must be able to write there. For a CIFS mount the owner comes from the mount's
      own uid= option, not from the filesystem — fix it where the mount is defined, not with
      chown, which does not stick.

- name: Deploy tdarr node quadlet
  vars:
    # Resolved against THIS role's directory, not podman_quadlet's: verified that both the
    # template module and lookup('ansible.builtin.template', ...) search the calling role
    # when one role is included from another.
    podman_quadlet_src: "templates/tdarr-node.container.j2"
    # The PUID, not root. The podman_quadlet role chowns every Volume= bind source with a
    # single owner, and the library mounts are filesystems whose ownership is pinned by
    # their mount options — chowning those to anything else does not stick and reports
    # changed on every run. The PUID is a no-op on them and is simultaneously correct for
    # configs, logs and the transcode cache, which Tdarr writes as that user.
    podman_quadlet_volume_owner: "{{ podman_quadlet_tdarr_puid }}"
    podman_quadlet_volume_group: "{{ podman_quadlet_tdarr_pgid }}"
    podman_quadlet_config_files:
      - src: "templates/tdarr-node.env.j2"
        dest: "{{ podman_quadlet_tdarr_data_dir }}/tdarr-node.env"
        mode: "0600"
        # Read once at container start, so a changed key does nothing until a restart.
        restart_service: true
  ansible.builtin.include_role:
    name: podman_quadlet
