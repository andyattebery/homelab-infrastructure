---
# Only reached when podman_quadlet_tdarr_manage_mounts is true.

- name: Assert tdarr CIFS mount inputs are provided
  ansible.builtin.assert:
    that:
      - podman_quadlet_tdarr_storage_host | length > 0
      - podman_quadlet_tdarr_smb_username | length > 0
      - podman_quadlet_tdarr_smb_password | length > 0
      - podman_quadlet_tdarr_mounts | rejectattr('share', 'defined') | list | length == 0
    fail_msg: >-
      podman_quadlet_tdarr_manage_mounts is true, so this role mounts the shares itself and
      needs podman_quadlet_tdarr_storage_host, _smb_username, _smb_password, and a `share`
      on every podman_quadlet_tdarr_mounts entry. If the caller already mounts these paths
      by other means, set podman_quadlet_tdarr_manage_mounts to false instead and none of
      these are read.

# Only the paths that are NOT already mounted get created. A mounted CIFS root has its
# ownership and permissions fixed by the mount's uid=/gid= options, so applying owner or mode
# to it does not stick — it reports changed on every run, and a chmod can fail outright.
# That is the same trap the calling role avoids by chowning bind sources to the PUID.
#
# Skipping the mounted ones is what makes an explicit mode safe here: it is only ever applied
# to a directory this task is about to create, never to a live mount.
- name: Test whether tdarr library mount points already exist as mounts
  ansible.builtin.command:
    cmd: "mountpoint -q {{ item.src }}"
  changed_when: false
  failed_when: false
  loop: "{{ podman_quadlet_tdarr_mounts }}"
  loop_control:
    label: "{{ item.src }}"
  register: __podman_quadlet_tdarr_premounted

- name: Create tdarr library mount points
  when: item.rc != 0
  ansible.builtin.file:
    path: "{{ item.item.src }}"
    state: directory
    mode: "0755"
  loop: "{{ __podman_quadlet_tdarr_premounted.results }}"
  loop_control:
    label: "{{ item.item.src }}"

- name: Install tdarr SMB credentials
  no_log: true
  ansible.builtin.template:
    src: smb-credentials.j2
    dest: "{{ podman_quadlet_tdarr_smb_credentials_path }}"
    owner: root
    group: root
    mode: "0600"

# systemd requires a mount unit's filename to be the escaped form of its Where= path.
# Derived with systemd-escape rather than a Jinja replace('/', '-'): the escaping is not a
# simple substitution — any path component containing a dash becomes \x2d, and other
# characters have their own escapes. A hand-rolled version works until a caller passes a
# path this role never anticipated, and then writes a unit systemd silently ignores.
- name: Derive tdarr library mount unit names
  ansible.builtin.command:
    cmd: "systemd-escape --path --suffix=mount {{ item.src }}"
  changed_when: false
  loop: "{{ podman_quadlet_tdarr_mounts }}"
  loop_control:
    label: "{{ item.src }}"
  register: __podman_quadlet_tdarr_unit_names

- name: Install tdarr library mount units
  ansible.builtin.template:
    src: cifs.mount.j2
    dest: "/etc/systemd/system/{{ __podman_quadlet_tdarr_unit_names.results[__idx].stdout | trim }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ podman_quadlet_tdarr_mounts }}"
  loop_control:
    index_var: __idx
    label: "{{ item.src }}"
  register: __podman_quadlet_tdarr_mount_units

- name: Enable and start tdarr library mounts
  ansible.builtin.systemd:
    name: "{{ item.stdout | trim }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ __podman_quadlet_tdarr_unit_names.results }}"
  loop_control:
    label: "{{ item.stdout | trim }}"

# Visible rather than silent, in the same spirit as podman_quadlet's report on a
# deliberately-uninstalled unit. `state: started` is a no-op on an already-mounted path, so
# a changed Options= line does NOT take effect here — a remount is required, and remounting
# under a running container is an operator decision rather than something a playbook should
# do unprompted.
- name: Report tdarr library mounts whose options changed but are already mounted
  vars:
    __stale: >-
      {{ __podman_quadlet_tdarr_mount_units.results
         | selectattr('changed') | map(attribute='item.src') | list }}
  when: __stale | length > 0
  ansible.builtin.debug:
    msg: >-
      Mount unit rewritten for: {{ __stale | join(', ') }}. If a path was already mounted,
      the new options are NOT active — systemd will not remount in place. Stop the tdarr
      node, `systemctl restart` the corresponding *.mount unit, then start the node.
