---
- name: Validate required inputs
  ansible.builtin.assert:
    that:
      - github_release_install_win_repo | default('') | length > 0
      - github_release_install_win_asset_patterns | default({}) | length > 0
      - github_release_install_win_dest_dir | default('') | length > 0
      - github_release_install_win_files_in_archive | default([]) | length > 0
    fail_msg: >-
      github_release_install_win requires _repo, _asset_patterns, _dest_dir and
      _files_in_archive.

# architecture2, NOT architecture. On Windows ansible_architecture is a localized string
# ('64-bit') and is null outright on a non-elevated logon; architecture2 is the POSIX-shaped
# value ('x86_64', 'arm64') the Linux role's pattern dicts are keyed on. Copying a caller from
# github_release_install without changing this fails on a fact that merely looks equivalent.
- name: Assert this architecture is supported by the caller's pattern dict
  ansible.builtin.assert:
    that: ansible_facts['architecture2'] in github_release_install_win_asset_patterns
    fail_msg: >-
      No asset pattern declared for architecture
      '{{ ansible_facts['architecture2'] }}' in github_release_install_win_asset_patterns.
      Caller declared: {{ github_release_install_win_asset_patterns.keys() | list }}.

- name: Get release from GitHub (pinned tag if set, else latest)
  ansible.windows.win_uri:
    url: >-
      https://api.github.com/repos/{{ github_release_install_win_repo }}/releases/{{
        ('tags/' + github_release_install_win_release_tag)
        if (github_release_install_win_release_tag | default('') | length > 0)
        else 'latest'
      }}
    return_content: true
  register: github_release_install_win_release_response

- name: Select the asset and compute its stamp
  ansible.builtin.include_tasks: select_asset.yaml
  vars:
    __github_release_install_win_release: "{{ github_release_install_win_release_response.json }}"

- name: Stat installed files
  ansible.windows.win_stat:
    path: '{{ github_release_install_win_dest_dir }}\{{ item | basename }}'
    get_checksum: false
  loop: "{{ github_release_install_win_files_in_archive }}"
  register: github_release_install_win_file_stats

- name: Stat release tag stamp
  ansible.windows.win_stat:
    path: "{{ github_release_install_win_tag_stamp_path }}"
    get_checksum: false
  register: github_release_install_win_stamp_stat

- name: Read release tag stamp
  when: github_release_install_win_stamp_stat.stat.exists
  ansible.builtin.slurp:
    src: "{{ github_release_install_win_tag_stamp_path }}"
  register: github_release_install_win_stamp_content

- name: Decide whether install is needed
  vars:
    stamped_tag: >-
      {{ (github_release_install_win_stamp_content | default({})).content
         | default('') | b64decode | trim }}
  ansible.builtin.set_fact:
    github_release_install_win_needs_install: >-
      {{ (github_release_install_win_file_stats.results
          | rejectattr('stat.exists') | list | length > 0)
         or stamped_tag != github_release_install_win_stamp_value }}

- name: Install
  when: github_release_install_win_needs_install | bool
  block:
    - name: Resolve asset URL
      ansible.builtin.set_fact:
        github_release_install_win_asset_url: >-
          {{ github_release_install_win_release_response.json.assets
             | selectattr('name', 'equalto', github_release_install_win_asset_name)
             | map(attribute='browser_download_url') | first }}

    - name: Create temp directory
      ansible.windows.win_tempfile:
        state: directory
        suffix: github_release_install_win
      register: github_release_install_win_tempdir

    - name: Download asset
      ansible.windows.win_get_url:
        url: "{{ github_release_install_win_asset_url }}"
        dest: '{{ github_release_install_win_tempdir.path }}\{{ github_release_install_win_asset_name }}'

    - name: Extract asset
      community.windows.win_unzip:
        src: '{{ github_release_install_win_tempdir.path }}\{{ github_release_install_win_asset_name }}'
        dest: '{{ github_release_install_win_tempdir.path }}\extract'

    # Windows keeps an open executable locked, so this fails outright if one of the destination
    # files is running — for ffmpeg that means a transcode is in flight. The role does not retry
    # or skip: a half-replaced install is worse than a failed run.
    - name: Install files to {{ github_release_install_win_dest_dir }}
      ansible.windows.win_copy:
        remote_src: true
        src: '{{ github_release_install_win_tempdir.path }}\extract\{{ item | replace("/", "\\") }}'
        dest: '{{ github_release_install_win_dest_dir }}\{{ item | basename }}'
      loop: "{{ github_release_install_win_files_in_archive }}"

    # Last install step on purpose. A failed download, extract or copy aborts the block before
    # this runs, leaving the previous stamp (or none) in place, so the next run retries instead
    # of believing itself converged.
    - name: Write release tag stamp
      ansible.windows.win_copy:
        content: "{{ github_release_install_win_stamp_value }}"
        dest: "{{ github_release_install_win_tag_stamp_path }}"

  # Inside the same `when` but outside the block's task list, so it runs whether or not the
  # install succeeded: win_unzip extracts the WHOLE archive, and nothing else removes it.
  always:
    - name: Remove temp directory
      when: github_release_install_win_tempdir.path is defined
      ansible.windows.win_file:
        path: "{{ github_release_install_win_tempdir.path }}"
        state: absent
