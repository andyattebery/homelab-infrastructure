# entirely on localhost; touches no remote host. The parts that need the real cluster
# — wait_for_connection, the pre-wipe script, the destroys and migrations actually
# happening, the backfill — are not here: the first live run is vm-host-01's rebuild.
#
#   cd ansible
#   ANSIBLE_VAULT_PASSWORD_FILE=tests/apt-sources/no-vault.sh \
#     .venv/bin/ansible-playbook -i roles/pve_node_rebuild/tests/inventory \
#     roles/pve_node_rebuild/tests/test.yml
