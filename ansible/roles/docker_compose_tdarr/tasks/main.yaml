---
# Custom flow plugins are NOT deployed here. They are host config, and two of them embed a
# hardlink-manager URL that has to be templated — which this role cannot do, because the
# only directory-copy mechanism (docker_compose_src_config_dirs) uses ansible.builtin.copy
# and never renders Jinja. The caller passes them as docker_compose_src_config_files
# entries instead; see the calling playbook.

- name: Assert the tdarr component is set
  ansible.builtin.assert:
    that: docker_compose_tdarr_component in ['server', 'node']
    fail_msg: >-
      docker_compose_tdarr_component must be "server" or "node"; got
      "{{ docker_compose_tdarr_component }}". One invocation deploys one component — a host
      running both invokes this role twice, giving each its own docker_compose_tdarr_env_suffix.
      An empty value would otherwise render a node and deploy it to docker-compose-tdarr-.yaml.

- name: Assert tdarr storage host is set
  ansible.builtin.assert:
    that: docker_compose_tdarr_storage_host | length > 0
    fail_msg: >-
      Set docker_compose_tdarr_storage_host to the host serving the media over SMB.
      Without it the CIFS volume names and device paths render empty, and the containers
      start with nothing mounted at /media.

# Length tests only, so no credential reaches the play output on failure.
- name: Assert tdarr SMB credentials are set
  ansible.builtin.assert:
    that:
      - docker_compose_tdarr_smb_username | string | length > 0
      - docker_compose_tdarr_smb_password | string | length > 0
      - docker_compose_tdarr_smb_uid | string | length > 0
      - docker_compose_tdarr_smb_gid | string | length > 0
    fail_msg: >-
      Set docker_compose_tdarr_smb_username, _password, _uid and _gid. This role always mounts
      the CIFS share, so an empty value renders mount options reading "username=,password="
      and fails at mount time on the host instead of here.

- name: "Configure tdarr {{ docker_compose_tdarr_component }}"
  vars:
    _sfx: "{{ docker_compose_tdarr_env_suffix }}"
    docker_compose_src_file_path: templates/docker-compose-tdarr.yaml.j2
    docker_compose_dst_file_name: "docker-compose-tdarr-{{ docker_compose_tdarr_component }}.yaml"
    # Keys are built with `~` so the suffix lands in the NAME, not the value. `.env` is a
    # host-global namespace that is merged rather than rewritten and never pruned, so two
    # invocations on one host must not write the same names — that is what the suffix is for.
    #
    # The four worker names are written whether or not the template reads them: a server only
    # reads them when docker_compose_tdarr_server_manage_workers is true, but they belong to this
    # role either way and the suffix already keeps components apart.
    #
    # SMB_STORAGE_* is deliberately NOT suffixed. docker_compose_comfyui writes the same four
    # names on purpose so both roles converge on one credential set per host.
    docker_compose_envs: >-
      {{
        {
          'TDARR_IMAGE_TAG' ~ _sfx: docker_compose_tdarr_image_tag,
          'TDARR_NODE_NAME' ~ _sfx: docker_compose_tdarr_node_name,
          'TDARR_TRANSCODE_CACHE_PATH' ~ _sfx: docker_compose_tdarr_transcode_cache_path,
          'TDARR_TRANSCODE_GPU_WORKERS' ~ _sfx: docker_compose_tdarr_transcode_gpu_workers,
          'TDARR_TRANSCODE_CPU_WORKERS' ~ _sfx: docker_compose_tdarr_transcode_cpu_workers,
          'TDARR_HEALTHCHECK_GPU_WORKERS' ~ _sfx: docker_compose_tdarr_healthcheck_gpu_workers,
          'TDARR_HEALTHCHECK_CPU_WORKERS' ~ _sfx: docker_compose_tdarr_healthcheck_cpu_workers,
          'SMB_STORAGE_USERNAME': docker_compose_tdarr_smb_username,
          'SMB_STORAGE_PASSWORD': docker_compose_tdarr_smb_password,
          'SMB_STORAGE_UID': docker_compose_tdarr_smb_uid,
          'SMB_STORAGE_GID': docker_compose_tdarr_smb_gid
        } | combine(
          {
            'TDARR_SERVER_IP' ~ _sfx: docker_compose_tdarr_server_ip,
            'TDARR_SERVER_PORT' ~ _sfx: docker_compose_tdarr_server_port,
            'TDARR_API_KEY' ~ _sfx: docker_compose_tdarr_api_key
          } if docker_compose_tdarr_component == 'node' else {}
        )
      }}
  ansible.builtin.include_role:
    name: docker_compose
