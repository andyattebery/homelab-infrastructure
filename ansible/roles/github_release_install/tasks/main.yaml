---
- name: Validate required inputs
  ansible.builtin.assert:
    that:
      - github_release_install_repo | default('') | length > 0
      - github_release_install_asset_patterns | default({}) | length > 0
      - github_release_install_archive_type in ['deb', 'tarball', 'binary']
      - github_release_install_binary_path | default('') | length > 0
      - github_release_install_archive_type != 'tarball'
        or (github_release_install_binary_in_archive | default('') | length > 0)
    fail_msg: >-
      github_release_install requires _repo, _asset_patterns,
      _archive_type (deb|tarball|binary), and _binary_path. tarball
      archive_type additionally requires _binary_in_archive.

- name: Assert this architecture is supported by the caller's pattern dict
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in github_release_install_asset_patterns
    fail_msg: >-
      No asset pattern declared for architecture
      '{{ ansible_facts['architecture'] }}' in github_release_install_asset_patterns.
      Caller declared: {{ github_release_install_asset_patterns.keys() | list }}.

- name: Get release from GitHub (pinned tag if set, else latest)
  ansible.builtin.uri:
    url: >-
      https://api.github.com/repos/{{ github_release_install_repo }}/releases/{{
        ('tags/' + github_release_install_release_tag)
        if (github_release_install_release_tag | default('') | length > 0)
        else 'latest'
      }}
    return_content: true
  register: github_release_install_release_response

- name: Pick asset name for this architecture
  ansible.builtin.set_fact:
    github_release_install_asset_name: >-
      {{ github_release_install_release_response.json.assets
         | map(attribute='name')
         | select('search', github_release_install_asset_patterns[ansible_facts['architecture']])
         | first }}

- name: Stat installed binary
  ansible.builtin.stat:
    path: "{{ github_release_install_binary_path }}"
  register: github_release_install_binary_stat

# Run the version command only if the binary exists. failed_when: false
# so a binary that lacks --version doesn't kill the run — installed
# version just stays empty and the install fires (same as a fresh host).
# Skipped entirely when stamping: the stamp is the source of truth, and
# there is no reason to execute the binary to learn something it cannot tell us.
- name: Get installed binary version
  when:
    - not (github_release_install_use_tag_stamp | bool)
    - github_release_install_binary_stat.stat.exists
  ansible.builtin.command: "{{ github_release_install_version_command }}"
  changed_when: false
  failed_when: false
  register: github_release_install_version_result

- name: Stat release tag stamp
  when: github_release_install_use_tag_stamp | bool
  ansible.builtin.stat:
    path: "{{ github_release_install_tag_stamp_path }}"
  register: github_release_install_stamp_stat

- name: Read release tag stamp
  when:
    - github_release_install_use_tag_stamp | bool
    - github_release_install_stamp_stat.stat.exists | default(false)
  ansible.builtin.slurp:
    src: "{{ github_release_install_tag_stamp_path }}"
  register: github_release_install_stamp_content

# The stamp compares the RAW tag_name, not the 'v'-stripped form the version
# command path uses. The stamp is written from that same field, so the two sides
# cannot disagree about stripping.
- name: Decide whether install is needed
  vars:
    release_tag_name: "{{ github_release_install_release_response.json.tag_name }}"
    latest_version: "{{ release_tag_name | regex_replace('^v', '') }}"
    installed_version_match: "{{ (github_release_install_version_result.stdout | default('')) | regex_search(github_release_install_version_regex, '\\1') }}"
    installed_version: "{{ (installed_version_match | first | default('')) if installed_version_match else '' }}"
    stamped_tag: >-
      {{ (github_release_install_stamp_content | default({})).content
         | default('') | b64decode | trim }}
    current_matches: >-
      {{ (stamped_tag == release_tag_name)
         if (github_release_install_use_tag_stamp | bool)
         else (installed_version == latest_version) }}
  ansible.builtin.set_fact:
    github_release_install_needs_install: >-
      {{ not github_release_install_binary_stat.stat.exists
         or not (current_matches | bool) }}

- name: Install
  when: github_release_install_needs_install
  block:
    - name: Resolve asset URL
      ansible.builtin.set_fact:
        github_release_install_asset_url: >-
          {{ github_release_install_release_response.json.assets
             | selectattr('name', 'equalto', github_release_install_asset_name)
             | map(attribute='browser_download_url') | first }}

    - name: Create temp directory
      ansible.builtin.tempfile:
        state: directory
      register: github_release_install_tempdir

    - name: Install (deb)
      when: github_release_install_archive_type == 'deb'
      block:
        - name: Download deb
          ansible.builtin.get_url:
            url: "{{ github_release_install_asset_url }}"
            dest: "{{ github_release_install_tempdir.path }}/{{ github_release_install_asset_name }}"
            mode: "0644"
        - name: Install deb
          ansible.builtin.apt:
            deb: "{{ github_release_install_tempdir.path }}/{{ github_release_install_asset_name }}"

    - name: Install (tarball)
      when: github_release_install_archive_type == 'tarball'
      block:
        - name: Download and extract tarball
          ansible.builtin.unarchive:
            remote_src: true
            src: "{{ github_release_install_asset_url }}"
            dest: "{{ github_release_install_tempdir.path }}"
            mode: "0755"
            owner: root
        - name: Copy binary to {{ github_release_install_binary_path }}
          ansible.builtin.copy:
            remote_src: true
            src: "{{ github_release_install_tempdir.path }}/{{ github_release_install_binary_in_archive }}"
            dest: "{{ github_release_install_binary_path }}"
            mode: "0755"
            owner: root

    - name: Install (binary)
      when: github_release_install_archive_type == 'binary'
      ansible.builtin.get_url:
        url: "{{ github_release_install_asset_url }}"
        dest: "{{ github_release_install_binary_path }}"
        mode: "0755"
        owner: root

    # Last install step on purpose. A failed download or extract aborts the block
    # before this runs, leaving the previous stamp (or none) in place, so the next
    # run retries instead of believing itself converged.
    - name: Write release tag stamp
      when: github_release_install_use_tag_stamp | bool
      ansible.builtin.copy:
        content: "{{ github_release_install_release_response.json.tag_name }}\n"
        dest: "{{ github_release_install_tag_stamp_path }}"
        mode: "0644"
        owner: root

  # Outside the block's task list but inside the same `when`, so it runs whether or
  # not the install succeeded: unarchive extracts the WHOLE archive, not just the
  # requested binary, and nothing else removes the directory. On a host with a tmpfs
  # /tmp that is RAM held until reboot, and it accumulates one archive per run.
  always:
    - name: Remove temp directory
      when: github_release_install_tempdir.path is defined
      ansible.builtin.file:
        path: "{{ github_release_install_tempdir.path }}"
        state: absent
