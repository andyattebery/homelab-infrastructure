---
# Command run on the installed binary to print its version. Stdout is
# matched against github_release_install_version_regex below to extract
# the comparable version string.
github_release_install_version_command: "{{ github_release_install_binary_path }} --version"

# Capture group 1 is compared (string-equal) against the GitHub release's
# tag_name with leading 'v' stripped. Default matches "X.Y.Z" anywhere
# in the version-command output, which covers clap's `<bin> X.Y.Z`,
# urfave/cli's `<bin> version vX.Y.Z`, and similar.
github_release_install_version_regex: '([0-9]+\.[0-9]+\.[0-9]+)'

# Pin to a specific release tag (e.g. 'autobuild-2026-05-31-13-22'). Empty =
# use the repo's 'latest' release (default behaviour). When pinned, set
# _version_command to `echo <tag>` (+ regex '(.*)') so idempotency compares
# the pinned tag against the release tag_name.
github_release_install_release_tag: ""

# Record the installed release tag in a file beside the binary, and compare THAT
# against the release's tag_name next run, instead of asking the binary for its
# version. The version command is not run at all in this mode.
#
# For builds whose compiled-in version cannot equal the release tag: a fork that
# appends its own suffix to an upstream version, a build whose tag carries a
# component the binary knows nothing about, anything where no regex over the
# version output can ever match.
#
# Different from the `_version_command: "echo <tag>"` idiom, which compares a
# pinned string against itself: that is idempotent but NEVER reinstalls when the
# pin is bumped, because both sides move together and the binary already exists.
# The stamp compares what is actually installed against what the release now
# offers, so bumping a pin — or publishing a new release while following
# 'latest' — does reinstall.
github_release_install_use_tag_stamp: false
github_release_install_tag_stamp_path: "{{ github_release_install_binary_path }}.release-tag"

# Symlink the installed binary onto PATH.
#
# _binary_path often points somewhere deliberately off PATH — a directory that is
# bind-mounted wholesale into a container, or one holding a build that must not
# shadow the distro's. That is the right place for the file and the wrong place for
# a human who just wants to run it. This puts a link where a shell will find it,
# without moving the install.
#
# Off by default: adding a name to /usr/local/bin is a decision about the host's
# PATH, not a detail of installing a binary. Left false, the binary is reachable
# only at _binary_path — which is all a container mount or an explicit ffmpegPath
# ever needs.
#
# The link is refreshed on every run, not only on install, so one deleted by hand
# comes back. It will NOT replace a regular file already sitting at the target:
# that fails the run rather than silently clobbering something another package owns.
github_release_install_symlink: false
github_release_install_symlink_path: "/usr/local/bin/{{ github_release_install_binary_path | basename }}"

# --- the on-host updater ----------------------------------------------------------------------
#
# The role installs and updates, but only while ansible-playbook is running. These deploy a
# script that does the same job between runs, plus one env file per install describing it.
#
# The script is a SECOND implementation of the decision above, in Python. The two can drift and
# nothing structural prevents it -- see the README. It is not generated from these tasks.

# Names the env file: <config_dir>/<name>.env. The basename is unique per host across every
# current caller; the eight call sites in this repo produce eight distinct basenames, so no two
# can collide. Override if you add a caller that would be the ninth.
#
# Wrong value: two installs share an env file and the second overwrites the first, so one binary
# silently stops being updated.
github_release_install_name: "{{ github_release_install_binary_path | basename }}"

# One env file per install. Not reconciled: the role is included once per install and cannot know
# the host's full set, so an env file for a caller you stopped invoking stays behind. That is
# harmless because the script refuses to install a binary that is absent -- the orphan reports
# SKIP rather than resurrecting something you removed.
github_release_install_config_dir: /etc/github-release-install

# /usr/local/bin, not /usr/local/sbin: every CLI in this repo that a human types lives in bin
# (gpu-mode, sleep-inhibit, pqup), and this is one. Nothing drives it on a timer.
github_release_install_updater_path: /usr/local/bin/github-release-update
github_release_install_updater_all_path: /usr/local/bin/github-release-update-all

# What the script looks for inside the extracted tarball. Defaults to _binary_in_archive, which is
# right whenever that path does not move between releases.
#
# Set this instead when the caller builds _binary_in_archive from the release version, because the
# rendered literal is only correct for the version current at deploy time. ${VERSION} (leading 'v'
# stripped) and ${TAG} (raw tag_name) are substituted by the script at run time:
#
#   github_release_install_binary_in_archive_pattern: "tool-${VERSION}.<arch expression>/tool"
#
# The architecture stays a Jinja expression and is resolved here, because the env file is
# per-host. Substituting it at run time as well would be a second source of truth for something
# already known.
github_release_install_binary_in_archive_pattern: "{{ github_release_install_binary_in_archive | default('') }}"

# Run by the script through `sh -c`, and ONLY when the binary's bytes actually changed.
#
# Empty by default, and empty is right for most callers: a consumer that spawns the binary per
# job picks up a replacement on its own. Set it where the consumer holds the old binary open --
# a service reading it from a read-only bind mount will not see a new build until it restarts,
# and nothing on the host would otherwise tell it.
#
# Prefer a form that does nothing to a stopped unit (`systemctl try-restart`), so a service
# someone turned off on purpose is not started behind their back.
#
# Wrong value: a non-zero exit fails the run AFTER the binary was replaced, so the install stands
# and the run reports failure.
github_release_install_post_update_command: ""
