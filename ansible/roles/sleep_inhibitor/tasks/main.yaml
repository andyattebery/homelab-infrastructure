---
- name: Assert sleep inhibitor checks are provided
  ansible.builtin.assert:
    that: sleep_inhibitor_checks_src | length > 0
    fail_msg: >-
      Set sleep_inhibitor_checks_src to a directory of executable check scripts. Without
      checks the service runs, finds nothing busy, and never holds the inhibitor — a unit
      that looks healthy while doing nothing.

- name: Install sleep inhibitor script
  ansible.builtin.copy:
    src: sleep-inhibitor.sh
    dest: /usr/local/bin/sleep-inhibitor.sh
    mode: "0755"
  notify: Restart sleep-inhibitor

- name: Create sleep inhibitor check directory
  ansible.builtin.file:
    path: /etc/sleep-inhibitor.d
    state: directory
    mode: "0755"

# Checks must be executable — the runner skips anything that is not, so a check copied
# without the bit is silently ignored rather than reported.
- name: Install sleep inhibitor checks
  ansible.builtin.copy:
    src: "{{ sleep_inhibitor_checks_src }}"
    dest: /etc/sleep-inhibitor.d/
    mode: "0755"
  notify: Restart sleep-inhibitor

# The checks directory is managed exclusively, so a check that is renamed or retired stops
# running. `copy` only ever adds, so without this a dropped check keeps voting "busy" from
# logic that no longer matches anything — the same pin-the-host-awake failure the checks
# themselves are written to avoid, arrived at from the other direction.
#
# The expected set is read from the caller's source directory on the CONTROLLER rather than
# with a fileglob lookup, whose search path inside an included role is not obvious enough to
# rely on.
- name: List checks the caller supplies
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/{{ sleep_inhibitor_checks_src }}"
    file_type: file
  register: __sleep_inhibitor_src_files

- name: List checks currently installed
  ansible.builtin.find:
    paths: /etc/sleep-inhibitor.d
    file_type: file
  register: __sleep_inhibitor_installed_files

- name: Remove checks the caller no longer supplies
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ __sleep_inhibitor_installed_files.files | map(attribute='path') | difference(
         __sleep_inhibitor_src_files.files | map(attribute='path') | map('basename')
         | map('regex_replace', '^', '/etc/sleep-inhibitor.d/') | list) | list }}
  notify: Restart sleep-inhibitor

- name: Install sleep inhibitor service
  ansible.builtin.template:
    src: sleep-inhibitor.service.j2
    dest: /etc/systemd/system/sleep-inhibitor.service
    mode: "0644"
  notify: Restart sleep-inhibitor

- name: Enable and start sleep inhibitor
  ansible.builtin.systemd:
    name: sleep-inhibitor
    enabled: true
    state: started
    daemon_reload: true
