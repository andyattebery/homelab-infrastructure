---
# adguardhome_docker_compose
adguardhome_config_directory: "{{ (docker_compose_dst_directory_path, 'adguardhome', 'conf') | path_join }}"

adguardhome_upstream_dns:
  - https://dns.cloudflare.com/dns-query
  - https://dns.quad9.net/dns-query
  - https://dns.google/dns-query

# Bootstrap resolves the DoH hostnames above, so it must not depend on a single
# operator — otherwise no DoH upstream can start. One per operator.
adguardhome_bootstrap_dns:
  - "9.9.9.10"
  - "149.112.112.10"
  - "2620:fe::10"
  - "2620:fe::fe:10"
  - "1.1.1.1"
  - "1.0.0.1"
  - "2606:4700:4700::1111"
  - "8.8.8.8"
  - "8.8.4.4"
  - "2001:4860:4860::8888"

# parallel: query every upstream, take the first answer. load_balance sends each
# query to one upstream, so a slow upstream slows that share of queries.
adguardhome_upstream_mode: parallel

adguardhome_filters:
  - name: AdGuard DNS filter
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
  - name: AdAway Default Blocklist
    url: https://adaway.org/hosts.txt
  - name: "HaGeZi's Normal Blocklist"
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_34.txt
