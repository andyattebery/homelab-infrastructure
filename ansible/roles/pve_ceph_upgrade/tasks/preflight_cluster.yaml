---
# Cluster-wide prerequisites, from the designated runner.
# The target is accepted too: a re-run after the monitor phase is how a failed
# run is finished (every later play is an idempotent restart or a final command).
- name: Assert the cluster runs the source release, or the target on a re-run
  vars:
    pve_ceph_upgrade_expected_min_mon_releases:
      - "{{ pve_ceph_upgrade_from }}"
      - "{{ pve_ceph_release }}"
  ansible.builtin.include_tasks:
    file: assert_min_mon_release.yaml

- name: Assert every daemon runs the source or the target release
  vars:
    pve_ceph_upgrade_versions_types: [mon, mgr, osd, mds]
    pve_ceph_upgrade_versions_allowed: ["{{ pve_ceph_upgrade_from }}", "{{ pve_ceph_release }}"]
  ansible.builtin.include_tasks:
    file: assert_versions.yaml

- name: Read PVE cluster status
  ansible.builtin.command:
    argv:
      - "{{ pve_ceph_upgrade_pvecm_command }}"
      - status
  register: pve_ceph_upgrade_pvecm
  changed_when: false

- name: Assert the PVE cluster is quorate
  ansible.builtin.assert:
    that:
      - pve_ceph_upgrade_pvecm.stdout is search('(?m)^Quorate:\s+Yes')
    fail_msg: "pvecm status does not report Quorate: Yes — {{ pve_ceph_upgrade_pvecm.stdout | replace('\n', ' / ') }}"
    quiet: true

- name: Assert cluster health
  ansible.builtin.include_tasks:
    file: assert_health.yaml
