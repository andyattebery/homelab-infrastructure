---
- name: Set package facts
  ansible.builtin.package_facts:
# `--version` is what stops pveceph defaulting to the newest release PVE ships.
#
# It also suppresses *pveceph's own* "continue (y/N)?", which pveceph.pm only
# shows when no version is given — but that is not the only prompt. pveceph
# shells out to
#   apt-get --no-install-recommends -o Dpkg::Options::=--force-confnew install -- ceph …
# with no `-y`, and `pveceph install` has no flag to add one (its whole option
# list is --allow-experimental, --repository, --version). Ansible allocates a
# pty, so that apt-get sees a terminal, prints "Do you want to continue? [Y/n]"
# and blocks on read(0) for ever rather than failing. That hung a live rebuild
# for 1h36m on 2026-09-09 while holding the dpkg locks.
#
# Two prompts, two guards, both needed:
#   stdin           answers apt-get's own confirmation.
#   DEBIAN_FRONTEND stops debconf and needrestart asking anything during unpack.
# stdin is a single "y" and then EOF, so a *second*, unanticipated prompt makes
# apt abort loudly instead of hanging — a failure that can be read, not waited on.
- name: Install ceph {{ pve_ceph_release }}
  when: "'ceph' not in ansible_facts['packages']"
  ansible.builtin.command:
    stdin: "y"
    argv:
      - "{{ pve_node_ceph_pveceph_command }}"
      - install
      - --repository
      - "{{ pve_node_ceph_repository }}"
      - --version
      - "{{ pve_ceph_release }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
