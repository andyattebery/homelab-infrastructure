---
# Everything that inspects and renders, and nothing that starts a unit, so a fixture test can
# include this file alone on a controller with no systemd. See ansible/tests/README.md.
#
# No handlers anywhere in this role, for the same reason: a handler fires at end of play, which
# in a fixture test means a systemd call on a machine that has none.

- name: Assert CIFS mount inputs are provided
  ansible.builtin.assert:
    that:
      - systemd_cifs_mount_server | length > 0
      - systemd_cifs_mount_username | length > 0
      - systemd_cifs_mount_password | length > 0
      - systemd_cifs_mount_uid | string | length > 0
      - systemd_cifs_mount_gid | string | length > 0
      - systemd_cifs_mount_mounts | length > 0
      - systemd_cifs_mount_mounts | rejectattr('path', 'defined') | list | length == 0
      - systemd_cifs_mount_mounts | rejectattr('share', 'defined') | list | length == 0
    fail_msg: >-
      systemd_cifs_mount needs a server, SMB username and password, a uid and gid, and at least
      one {path, share} entry. uid/gid have no default because a CIFS mount's ownership is fixed
      by them: a wrong value is not a mount failure, it is a service that can read the share and
      cannot write to it.

# Only the paths that are NOT already mounted get created. A mounted CIFS root has its ownership
# and permissions fixed by the mount's uid=/gid= options, so applying a mode to it does not
# stick — it reports changed on every run, and a chmod can fail outright.
#
# Skipping the mounted ones is what makes an explicit mode safe here: it is only ever applied to
# a directory this task is about to create, never to a live mount.
- name: Test whether CIFS mount points already exist as mounts
  ansible.builtin.command:
    cmd: "{{ systemd_cifs_mount_mountpoint }} -q {{ item.path }}"
  changed_when: false
  failed_when: false
  loop: "{{ systemd_cifs_mount_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: __systemd_cifs_mount_premounted

- name: Create CIFS mount points
  when: item.rc != 0
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ __systemd_cifs_mount_premounted.results }}"
  loop_control:
    label: "{{ item.item.path }}"

# One file for every mount from this server, not one per mount. Two callers mounting the same
# server therefore converge on a single credential rather than each keeping a copy.
- name: Install CIFS credentials
  no_log: true
  ansible.builtin.template:
    src: smb-credentials.j2
    dest: "{{ systemd_cifs_mount_credentials_path }}"
    owner: "{{ systemd_cifs_mount_file_owner }}"
    group: "{{ systemd_cifs_mount_file_group }}"
    mode: "0600"

# systemd requires a mount unit's filename to be the escaped form of its Where= path. Derived
# with systemd-escape rather than a Jinja replace('/', '-'): the escaping is not a simple
# substitution — any path component containing a dash becomes \x2d, and other characters have
# their own escapes. A hand-rolled version works until a caller passes a path this role never
# anticipated, and then writes a unit systemd silently ignores.
- name: Derive CIFS mount unit names
  ansible.builtin.command:
    cmd: "{{ systemd_cifs_mount_systemd_escape }} --path --suffix=mount {{ item.path }}"
  changed_when: false
  loop: "{{ systemd_cifs_mount_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: __systemd_cifs_mount_unit_names

- name: Install CIFS mount units
  ansible.builtin.template:
    src: cifs.mount.j2
    dest: "{{ systemd_cifs_mount_unit_directory_path }}/{{ __systemd_cifs_mount_unit_names.results[__idx].stdout | trim }}"
    owner: "{{ systemd_cifs_mount_file_owner }}"
    group: "{{ systemd_cifs_mount_file_group }}"
    mode: "0644"
  loop: "{{ systemd_cifs_mount_mounts }}"
  loop_control:
    index_var: __idx
    label: "{{ item.path }}"
  register: __systemd_cifs_mount_units
