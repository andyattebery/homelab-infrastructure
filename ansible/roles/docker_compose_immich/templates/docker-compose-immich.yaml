---
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-database
    environment:
      - TZ=${TZ}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - DB_HOSTNAME=immich-postgres
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - REDIS_HOSTNAME=immich-redis
    healthcheck:
      disable: false
    networks:
      - traefik
      - tsdproxy
      - immich
    volumes:
      - ${IMMICH_PHOTOS_DIRECTORY}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`immich.$DOMAIN_NAME`)
      - traefik.http.routers.immich.tls.certresolver=cloudflare
      - dsm.name=Immich
      - tsdproxy.enable=true
      - tsdproxy.name=immich
      - "tsdproxy.port.1=443/https:2283/http"

  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich

  immich-database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
    volumes:
      - ${IMMICH_DB_DIRECTORY}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - immich

networks:
  immich:
    name: immich
  traefik:
    name: traefik
    external: true
  tsdproxy:
    name: tsdproxy
    external: true