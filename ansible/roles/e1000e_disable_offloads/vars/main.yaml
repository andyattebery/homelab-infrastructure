---
# Resolve an interface name from a MAC. Defined here rather than as a set_fact so
# it re-evaluates per loop iteration and never leaks into play scope.
#
# Set `_e1000e_lookup_mac` in the consuming task's `vars:`.
#
# `type == 'ether'` is load-bearing: a bridge inherits the MAC of its port, so on
# a host where this NIC is vmbr0's uplink the lookup would otherwise return the
# bridge — writing `iface vmbr0 inet manual` and running `ethtool -K vmbr0`.
# Bridges are type 'bridge', bonds type 'bond'; only real NICs are type 'ether'.
_e1000e_matching_nics: >-
  {{ ansible_facts['interfaces']
     | map('extract', ansible_facts)
     | selectattr('macaddress', 'defined')
     | selectattr('macaddress', 'eq', _e1000e_lookup_mac)
     | selectattr('type', 'defined')
     | selectattr('type', 'eq', 'ether')
     | map(attribute='device') | list }}

# Empty unless exactly one physical interface matched, so ambiguity fails loudly
# rather than being resolved by picking the first result.
_e1000e_resolved_nic_name: >-
  {{ (_e1000e_matching_nics | first)
     if (_e1000e_matching_nics | length == 1) else '' }}
