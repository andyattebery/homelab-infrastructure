---
- name: Validate inputs
  ansible.builtin.include_tasks:
    file: validate.yaml
- name: Configure haproxy docker compose
  vars:
    docker_compose_src_file_path: templates/docker-compose-haproxy.yaml.j2
    docker_compose_dst_file_name: "docker-compose-haproxy-{{ haproxy_name }}.yaml"
    docker_compose_src_config_files:
      - src_file_path: templates/haproxy.cfg.j2
        dst_relative_file_path: "haproxy-{{ haproxy_name }}/haproxy.cfg"
        service_name_to_restart: "{{ haproxy_name }}"
  ansible.builtin.include_role:
    name: docker_compose
