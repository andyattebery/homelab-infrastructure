# Tools for talos/. talosctl must match the cluster's Talos version, and kubectl must be within
# one minor of its Kubernetes. Everything generated -- including kubectl's cache and helm's
# cache, config and data -- stays in generated/, so nothing lands in ~/.talos, ~/.kube or helm's
# default home.
[tools]
talosctl = '1.14.1'
kubectl = '1.37'
helm = '4.3'

[env]
TALOSCONFIG = '{{config_root}}/generated/talosconfig'
KUBECONFIG = '{{config_root}}/generated/kubeconfig'
KUBECACHEDIR = '{{config_root}}/generated/kube-cache'
HELM_CACHE_HOME = '{{config_root}}/generated/helm/cache'
HELM_CONFIG_HOME = '{{config_root}}/generated/helm/config'
HELM_DATA_HOME = '{{config_root}}/generated/helm/data'
# The six nodes, for the tasks below. IPs rather than DNS names: the names carry the internal
# domain.
TALOS_NODES = '192.168.1.181,192.168.1.182,192.168.1.183,192.168.1.184,192.168.1.185,192.168.1.186'

# talosctl against all six nodes; arguments are appended, e.g. `mise run nodes memory`.
# To stop the cluster: `mise run nodes shutdown --force` (--force skips each node's cordon/drain,
# which needs the Kubernetes API that the control planes take down with them), then switch the
# board off.
[tasks.nodes]
description = 'Run a talosctl command against all six nodes'
run = 'talosctl --nodes "$TALOS_NODES"'

# Every sensor on every node: CPU, NVMe drive, and the Pi's under-voltage alarm. A node list
# narrows it, e.g. `mise run temps 192.168.1.181,192.168.1.182`.
[tasks.temps]
description = 'Show every temperature sensor and alarm on each node'
run = 'scripts/temps.sh'
